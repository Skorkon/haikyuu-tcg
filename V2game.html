  * {

/* ----------------------------------------------------------------------------------------------- REMAKE : PASO 1 */
:root {
  --surface: #16161a;         /* superficie oscura de paneles */
  --surface2: #1e1e24;        /* superficie secundaria (inputs) */
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --text: #e8e8ec;            /* texto claro (sobre fondos oscuros) */
  --text2: #9090a0;           /* texto gris apagado */
  --cancha2: #7fb8d9; 
  --bggris: #B9B9B9;
}

body {
  font-family: var(--font-texto), Arial, sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  /* background: var(--bg);      /* ← antes #d0d0d0, ahora el gris clarito de toda la app */
}

/* ------------------------------------------------------------------------------------------------------- REMAKE 2 */
/* título: el texto, recto y en blanco */
.panel h3,
.panel-derecha h3 {
  position: relative;          /* referencia para colocar la placa detrás */
  isolation: isolate;          /* la placa (z-index:-1) queda detrás del texto, pero no detrás del panel */
  display: inline-block;       /* la caja mide lo que el texto, no todo el ancho */
  margin: 0 0 12px 3px;
  padding: 9px 12px 8px;
  font-family: var(--font-titulos);
  font-weight: var(--peso-titulos);
  font-size: 14px;
  line-height: 1;
  letter-spacing: var(--espaciado-titulos);
  color: var(--papel);
}

/* la placa negra inclinada, dibujada detrás del texto */
.panel h3::before,
.panel-derecha h3::before {
  content: "";                 /* sin esto, el pseudoelemento no aparece */
  position: absolute;
  inset: 0;                    /* ocupa exactamente la caja del título */
  z-index: -1;                 /* detrás del texto */
  background: var(--tinta);
  transform: skewX(-10deg);    /* inclinación estilo Persona */
  box-shadow: var(--sombra-placa);
}

/* -------------------------------------------------- ZONA PRINCIPAL */
.main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* -------------------------------------------------- IZQUIERDA */
.panel-izquierda {
  width: 30%;
  background: transparent;  
  padding: 10px;
  overflow-y: auto;   
  display: flex;
  flex-direction: column;
  position: relative;
  border-right: 6px solid var(--accent);    /* como las columnas del index */
}

.titulo-mano-rival {
  font-family: var(--font-titulos);
  font-weight: var(--peso-titulos);
  letter-spacing: var(--espaciado-titulos);
  font-size: 18px;
  color: var(--tinta);
  margin: 6px 0 10px;
  text-align: center;
}
#mano-rival {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 4px;
  margin: -10px -10px 10px -10px;
  padding-top: 4px;
  flex-shrink: 0;   /* ← nuevo: nunca se encoge, siempre arriba del todo */
}

.contenido-inferior {
  display: flex;
  flex-direction: column;              
  margin-top: auto;      
}

/* -------------------------------------------------- DERECHA */
.panel-derecha {
  width: 20%;
  background: transparent;        /* ← antes var(--bg) */
  padding: 10px;
  overflow-y: auto;
  border-left: 6px solid var(--accent); 
  display: flex;
  flex-direction: column;
}

.panel {
  margin-bottom: 15px;
  /*padding: 10px 12px;
  /* background: var(--papel);          /* interior blanco */
  /* border: var(--contorno);           /* trazo de tinta */
  /* border-radius: 0;                  /* esquinas rectas, como una viñeta */
  /* box-shadow: var(--sombra-dura);    /* sombra dura */
  color: var(--tinta);
}

/* ----------------------------------------------------------------------------------------------- REMAKE : PASO 2 */
/* ---------------------------------------- BOTONES DE PANEL (estilo Persona) */
.panel button {
  position: relative;
  isolation: isolate;            /* la placa queda detrás del texto, dentro del botón */
  display: block;
  width: 100%;
  margin: 8px 0;
  padding: 9px 12px 8px;
  background: transparent;       /* el fondo lo dibuja la placa */
  border: none;
  color: var(--papel);
  font-family: var(--font-titulos);
  font-weight: var(--peso-titulos);
  font-size: 14px;
  line-height: 1;
  letter-spacing: var(--espaciado-titulos);
  cursor: pointer;
  transition: color 0.15s;                              /* el texto cambia de color suavemente */
}
/* la placa en romboide */
.panel button::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: var(--tinta);
  transform: skewX(-10deg);
  box-shadow: var(--sombra-placa);
  transition: background 0.15s, box-shadow 0.15s;       /* la placa y la sombra, también */
}
/* hover: se rellena de tu color */
.panel button:hover {
  color: var(--tinta);
}
.panel button:hover::before {
  background: var(--accent);          /* placa: tu color */
  box-shadow: var(--sombra-invertida);
}
/* pulsado: se hunde hasta tapar la sombra */
.panel button:active {
  color: var(--papel);                    /* texto negro sobre tu color */
  transform: translate(2px, 2px);         /* se hunde lo que medía la sombra */
}
.panel button:active::before {
  background: var(--accent);
  box-shadow: 0 0 0 2px var(--papel);     /* solo el borde blanco, sin sombra */
}
/* deshabilitado: gris y plano (va al final para ganar a hover y active) */
.panel button:disabled {
  color: var(--papel);
  cursor: not-allowed;
  transform: none;
}
.panel button:disabled::before {
  background: var(--gris-medio);
  box-shadow: none;
}

/* ---------------------------------------- PANEL ACCIONES: título a la izquierda, botones a la derecha */
/* ---------------------------------------- PANEL ACCIONES: título abajo, botones creciendo hacia arriba */
.panel-acciones {
  display: flex;
  align-items: flex-end;         /* título y columna de botones alineados por abajo */
  gap: 14px;
  margin: 0 14px 15px;           /* margen lateral dentro de la franja */
}

.panel-acciones h3 {
  flex: none;                    /* el título no se estira ni se encoge */
  margin: 0 0 0 3px;
}

.acciones-botones {
  flex: 1;                       /* la columna ocupa todo el ancho restante */
  display: flex;
  flex-direction: column-reverse;   /* el primer botón del HTML va abajo; los siguientes, encima */
  gap: 8px;
}

.acciones-botones button {
  margin: 0;                     /* el espacio entre botones ya lo da gap */
}
.panel-otros {
  display: grid;
  grid-template-columns: auto 1fr;     /* columna 1: lo que mida el título · columna 2: el resto */
  column-gap: 14px;
  row-gap: 8px;
  align-items: center;                 /* el título y el primer botón, centrados en su fila */
  align-content: start;                /* las filas se apilan arriba, no se reparten la altura */
}
.panel-otros h3 {
  grid-column: 1;                      /* el título, siempre en la columna izquierda */
  margin: 0 0 0 3px;                   /* el espacio entre filas ya lo da row-gap */
}
.panel-otros button {
  grid-column: 2;                      /* todos los botones, en la columna derecha */
  margin: 0;
}

/* panel Otros: fijo en el centro vertical del panel izquierdo */
.panel-otros {
  position: absolute;            /* saca a Otros del flujo del panel, sin verse afectado por los otros paneles*/
  top: 40%;                      /* su borde superior, a media altura */
  left: 24px;
  right: 24px;
  margin: 0;
}

.mano-bottom {
  padding: 16px 0 4px;               /* aire arriba para que las cartas suban al pasar el ratón */
  text-align: center;
}

/* ----------------------------------------------------------------------------------------------- REMAKE : PASO 3 Columna derecha */

#selector-titulo::before {

  /* -------------------- BARRA DE SCROLL PERSONALIZADA  ------------------------- */
  /* ── SCROLLBAR PANEL IZQUIERDA ────────────────────────────── */
.panel-izquierda::-webkit-scrollbar { width: 6px; }
.panel-izquierda::-webkit-scrollbar-track { background: var(--bg); }

/* ── SCROLLBAR PANEL DERECHA ──────────────────────────────── */

.panel-derecha::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 6px; }

/* -------------------------------------------------- CENTRO 60% */
.campo-central {

/* -------------------------------------------------- LOG */
#log {
  white-space: pre-wrap;
  font-size: 12px;
  flex-direction: column;  /* cada línea debajo de la anterior */
  gap: 2px;                /* pequeño espacio entre líneas */
}

/* -------------------------------------------------- MANO */

#mano {
  display: flex;
  gap: 5px;
  justify-content: center;
  flex-wrap: wrap;
  flex-wrap: nowrap; /* no saltar a segunda fila */
  filter:           /* borde blanco a toda la mano */
    drop-shadow(2px 0 0 var(--papel))
    drop-shadow(-2px 0 0 var(--papel))
    drop-shadow(0 2px 0 var(--papel))
    drop-shadow(0 -2px 0 var(--papel));
}

/* -------------------------------------------------- CARTAS */
.carta {
  border: 1px solid black;
  border-radius: 0;
  width: 80px;
  height: 112px;
  cursor: pointer;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

.carta:hover {
  outline: 2px solid var(--tinta);        /* trazo de tinta al pasar el ratón */
  outline-offset: -2px;                   /* por dentro de la carta */
}

.carta.seleccionada {
  outline: 3px solid var(--tinta);        /* marco negro, por dentro de la carta */
  outline-offset: -2px;
  box-shadow: 3px 3px 0 var(--accent);    /* sombra dura de tu color, como en los botones */
}

/* carta de la mano: se levanta al pasar el ratón */
#mano .carta {
  position: relative;               /* necesario para que z-index funcione */
  transition: transform 0.12s ease-out;
}
#mano .carta:hover {
  transform: translateY(-12px);     /* sube 12px */
  z-index: 10;                      /* se pone delante de sus vecinas */
}
/* la carta seleccionada de la mano se queda levantada */
#mano .carta.seleccionada {
  transform: translateY(-12px);
  z-index: 10;
}
/* la carta que se está arrastrando se queda semitransparente en su sitio */
#mano .carta.arrastrando {
  opacity: 0.4;
}
/* mientras se reordena la mano, el hover no levanta cartas (el navegador lo deja "congelado") */
#mano.ordenando .carta:not(.seleccionada):hover {
  transform: none;
  z-index: auto;
  outline: none;
}

/* --------------------------------------------------------------------------------- NUEVA CANCHA */
.cancha-rect {
  position: absolute;
  display: grid;
  grid-template-columns: repeat(3, 80px);
  grid-template-rows: 112px 16px 112px;
  gap: 6px;
  padding: 8px;
  border: 5px solid white;
  border-radius: 0px;
  background: #E8761A;   /* fondo ligeramente distinguible del resto de la cancha */
}

  /* posición del rectángulo dentro de cada .lado-jugador — ajusta estos valores según el resto de tus zonas */
  #cancha-j1 { top: 0px; left: 170px; }
  #cancha-j2 { top: -20px; left: 170px; }

  .cancha-rect .zona {
  position: relative;   /* dentro del grid, no queremos position:absolute */
  top: auto;
  left: auto;
}

  /* la línea divisoria, ocupa toda la fila del medio */
  .cancha-rect::before {
    content: "";
    grid-column: 1 / 4;    /* ocupa las 3 columnas */
    grid-row: 2;            /* la fila del medio */
    height: 6px;
    background: white;
    align-self: center;
    margin: 0 -8px;
  }

  #cancha-j1 {
    top: 0px;
    left: 170px;
    border-top: none;    /* ← quita el borde que mira hacia la red */
  }

  #cancha-j2 {
    top: -20px;
    left: 170px;
    border-bottom: none;  /* ← quita el borde que mira hacia la red */
    z-index: 2;
  }

  .cancha-conector {
    position: absolute;
    left: 170px;              /* mismo left que #cancha-j1/j2, ahora sí en el mismo sistema de coordenadas */
    top: -40px;                 /* sube por encima del propio #campo-j1, para tapar el hueco hacia la red */
    width: 277px;               /* ancho recalculado con box-sizing: border-box */
    height: 40px;
    background: #E8761A;
    border-left: 5px solid white;
    border-right: 5px solid white;
    z-index: 1;
  }

  .cancha-marco {
    position: absolute;
    left: 172px;      /* 130 de franja + 170 (inicio de la cancha) − 50 de zona libre − 8 de borde */
    top: 2px;         /* 50px de zona libre por encima de la línea de fondo del rival */
    width: 394px;     /* 278 de cancha + 2×50 de zona libre + 2×8 de borde */
    height: 673px;    /* 557 de cancha (las dos mitades) + 2×50 + 2×8 */
    background: var(--cancha2);
    border: 8px solid white;
    z-index: 0;       /* por detrás de todo lo demás */
  }

  .fase-tracker {
    position: absolute;
    bottom: 10px;
    right: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    z-index: 20;
  }

  .fase-barra {
    width: 80px;
    padding: 3px 6px;
    background: #999999;    /* gris por defecto, fase inactiva */
    border: 2px solid #777777;
    border-radius: 4px;
    color: white;
    font-size: 9px;
    font-weight: bold;
    text-align: center;
  }

  .fase-flecha {
    font-size: 8px;
    color: #999999;
    line-height: 1;
  }

  /* FASE ACTIVA: color de esa fase + borde más grueso */
  .fase-barra.activa {
    border-width: 3px;
  }
  .fase-barra[data-fase="saque"].activa      { background: #f26a00; border-color: #e65100; }
  .fase-barra[data-fase="robo"].activa       { background: #9c27b0; border-color: #7b1fa2; }
  .fase-barra[data-fase="recepcion"].activa  { background: #2b6bc4; border-color: #1565c0; }
  .fase-barra[data-fase="pase"].activa       { background: #3d9142; border-color: #2e7d32; }
  .fase-barra[data-fase="remate"].activa     { background: #d94040; border-color: #c62828; }
  .fase-barra[data-fase="bloqueo"].activa    { background: #3a3a3a; border-color: #212121; }

  /* CONTADOR DE ATAQUE Y DEFENSA */
  .contador-campo {
    background: #fdfaf0;

<script>
  // ====================================================== ESCALAR EL TABLERO AL ESPACIO DISPONIBLE
  const ESCALA_MAXIMA = 1.6;   // tope de ampliación, para que las cartas no se vean borrosas en monitores grandes
  const TAMANO_PELOTA = 32;    // tamaño de la pelota a escala 1, en px

  function escalarTablero() {
    const campo   = document.querySelector(".campo-central");
    const tablero = document.getElementById("tablero");
    const pelota  = document.getElementById("pelota");
    const estilo  = getComputedStyle(campo);

    // espacio libre dentro del campo central (sin contar su padding)
    const anchoLibre = campo.clientWidth  - parseFloat(estilo.paddingLeft) - parseFloat(estilo.paddingRight);
    const altoLibre  = campo.clientHeight - parseFloat(estilo.paddingTop)  - parseFloat(estilo.paddingBottom);

    // la escala es la menor de las dos: así el tablero cabe entero sin deformarse
    const escala = Math.min(
      anchoLibre / tablero.offsetWidth,     // offsetWidth es el tamaño real, sin escalar
      altoLibre  / tablero.offsetHeight,
      ESCALA_MAXIMA
    );

    tablero.style.transform = `scale(${escala})`;                // amplía o reduce desde el centro
    pelota.style.width  = TAMANO_PELOTA * escala + "px";         // la pelota crece con el tablero
    pelota.style.height = TAMANO_PELOTA * escala + "px";
    moverPelota();                                               // recolocar la pelota en su zona
  }

  // se ejecuta al cargar y cada vez que cambie el tamaño del campo central
  new ResizeObserver(escalarTablero).observe(document.querySelector(".campo-central"));

  // ====================================================== SONIDO AL CAMBIAR DE POSICIÓN UNA CARTA DE LA MANO
  const sonidoCarta = new Audio("audio/draw2.mp3");   // se carga una sola vez
  const VOLUMEN_CARTA = 0.05;                          // 20% del volumen general del jugador

  function reproducirSonidoCarta() {
    try {
      if (obtenerHinchada() === "ninguna") return;    // "Sin sonido" en ajustes: silencio
      sonidoCarta.volume = obtenerVolumen() * VOLUMEN_CARTA;
      sonidoCarta.currentTime = 0;                    // vuelve al principio si aún sonaba
      sonidoCarta.play().catch(() => {});             // si el navegador lo bloquea, no da error
    } catch (err) {
      console.warn("[sonido]", err);                  // un fallo de sonido nunca debe afectar a la partida
    }
  }

  // ====================================================== REORDENAR LA MANO ARRASTRANDO
  const manoEl = document.getElementById("mano");
  let cartaArrastrada = null;      // el div de la carta que se está arrastrando
  let indiceOrigen = null;         // su posición en la mano al empezar
  let margenSolape = "0px";        // el margen negativo con el que renderMano solapa las cartas

  // la mano que se ve en pantalla (el mismo criterio que usa renderMano)
  function jugadorDeLaMano() {
    return modoOnline ? game.jugadores[miNumero - 1] : game.jugadores[game.jugadorActivo];
  }

  // renderMano da margen 0 a la primera carta y margen negativo a las demás;
  // al mover cartas hay que repetirlo, si no el solape se descoloca
  function reajustarSolape() {
    Array.from(manoEl.children).forEach((c, i) => {
      c.style.marginLeft = i === 0 ? "0" : margenSolape;
    });
  }

  // 1. empieza el arrastre
  manoEl.addEventListener("dragstart", function (e) {
    const carta = e.target.closest(".carta");
    if (!carta) return;
    manoEl.classList.add("ordenando");               // desactiva la subida por hover mientras se arrastra
    const cartas = Array.from(manoEl.children);
    cartaArrastrada = carta;
    indiceOrigen = cartas.indexOf(carta);
    margenSolape = cartas.length > 1 ? cartas[1].style.marginLeft : "0";  // se lo copiamos a renderMano

    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", "");                  // Firefox no arrastra sin algún dato
    document.getElementById("tooltip").style.display = "none";

    // la transparencia se aplica un instante después: si no, la "imagen fantasma"
    // que el navegador pega al ratón saldría también transparente
    setTimeout(() => carta.classList.add("arrastrando"), 0);
  });

  // 2. mientras se arrastra: mover la carta a donde caería
  manoEl.addEventListener("dragover", function (e) {
    if (!cartaArrastrada) return;                    // solo si el arrastre empezó en la mano
    e.preventDefault();                              // permitir soltar aquí

    const destino = e.target.closest(".carta");
    if (!destino || destino === cartaArrastrada) return;   // en un hueco o sobre sí misma: nada

    // ¿mitad izquierda (va delante) o mitad derecha (va detrás) de la carta de destino?
    const rect = destino.getBoundingClientRect();
    const delante = e.clientX < rect.left + rect.width / 2;
    const referencia = delante ? destino : destino.nextSibling;   // se insertará justo antes de esta

    // si ya está en ese sitio, no tocar nada (evita parpadeos)
    if (referencia === cartaArrastrada || cartaArrastrada.nextSibling === referencia) return;

    manoEl.insertBefore(cartaArrastrada, referencia);   // referencia null = al final
    reajustarSolape();
    reproducirSonidoCarta();                            // suena cada vez que la carta cambia de posición
  });

  // 3. se suelta dentro de la mano: guardar el orden que se ve en pantalla
  manoEl.addEventListener("drop", function (e) {
    e.preventDefault();
    if (!cartaArrastrada) return;

    const indiceFinal = Array.from(manoEl.children).indexOf(cartaArrastrada);
    const mano = jugadorDeLaMano().mano;
    const [carta] = mano.splice(indiceOrigen, 1);    // sacarla de su sitio original
    mano.splice(indiceFinal, 0, carta);              // meterla donde ha quedado en pantalla
  });

  // 4. fin del arrastre (se haya soltado dentro o fuera)
  manoEl.addEventListener("dragend", function () {
    if (!cartaArrastrada) return;
    manoEl.classList.remove("ordenando");
    cartaArrastrada = null;
    indiceOrigen = null;
    renderMano();   // redibuja desde el array: con el orden nuevo, o el original si se soltó fuera
  });
</script>

</html>
