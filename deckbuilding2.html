<!DOCTYPE html>  <!-- documento HTML5 -->
<html lang="es">
<head>
  <link rel="icon" type="image/png" href="favicon.png">                   <!-- icono navegador -->
  <meta charset="UTF-8">                                                  <!-- codificación de caracteres -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <!-- responsive básico -->
  <title>HV-TCG · Deckbuilder</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;500;700&display=swap'); /* fuentes google font */
    * { box-sizing: border-box; margin: 0; padding: 0; }          /* reset básico para todos los elementos */

    :root {                                       /* variables de color reutilizables, mismas que index.html y lobby.html */
      --bg: #f2f0e8;                            /* fondo gris clarito */
      --surface: #16161a;                       /* superficie oscura de paneles */
      --surface2: #1e1e24;                      /* superficie secundaria (inputs, etc) */
      --surface3: #26262e;                      /* superficie terciaria, para detalles */
      --border: rgba(255,255,255,0.07);         /* borde muy sutil */
      --border2: rgba(255,255,255,0.13);        /* borde algo más marcado */
      --text: #e8e8ec;                          /* texto claro (para fondos oscuros) */
      --text2: #9090a0;                         /* texto gris apagado */
      --accent: #E8761A;                        /* naranja color secundario */
      --font-display: 'Bebas Neue', sans-serif;   /* fuente de títulos */
      --font-body: 'Noto Sans JP', sans-serif;    /* fuente de texto normal */
    }
    body {
      background: var(--bg);           /* fondo general de la página */
      color: var(--text);              /* color de texto por defecto */
      font-family: var(--font-body);   /* fuente base */
      font-size: 14px;                 /* tamaño de texto base */
      min-height: 100vh;               /* ocupa toda la altura de pantalla */
      overflow: hidden;                /* sin scroll en el body — cada columna scrollea por su cuenta */
    }

    /* -------------------------------------------------- CONTENEDOR TRÍPTICO ------------------------------------------ */
    .triptico {
      display: flex;         /* las 3 columnas en fila, una al lado de otra */
      width: 100%;           /* ocupa todo el ancho de la pantalla */
      height: 100vh;         /* ocupa toda la altura de la pantalla */
    }

    /* -------------------------------------------------- COLUMNAS ------------------------------------------ */
    #columna-izquierda {
      width: 300px;                                /* ancho fijo y pequeño — la haces "muy fina" */
      flex-shrink: 0;                             /* no se encoge nunca, aunque falte espacio */
      background-image: url('img/fondos/deckb.jpg'); 
      background-color: #1a1a2e;                /* color de respaldo mientras no hay imagen */
      background-size: cover;                     /* la imagen cubre toda la columna sin deformarse */
      background-position: center;                /* centrada dentro de la columna */
      border-right: 3px solid var(--accent);      /* borde naranja hacia el centro, igual que en index/lobby */
      position: relative;                         /* necesario para poner el preview encima */
    }
    .columna-central {
      flex: 1;                     /* crece para ocupar TODO el espacio que sobra entre izquierda y derecha */
      display: flex;               /* por si luego apilamos filtros arriba y catálogo abajo */
      flex-direction: column;      /* apilado en vertical */
      overflow: hidden;            /* el scroll irá en el catálogo interior, no aquí */
      background: var(--bg);       /* mismo fondo gris clarito */
    }
    .columna-derecha {
      width: 380px;                 /* ancho fijo, mediano (más pequeño que el central, más grande que la izquierda) */
      flex-shrink: 0;               /* no se encoge */
      background: var(--surface);   /* fondo oscuro, como un panel */
      border-left: 3px solid var(--accent); /* borde naranja hacia el centro */
      display: flex;
      flex-direction: column;       /* apilado en vertical (cabecera del mazo, lista de cartas, etc.) */
      overflow: hidden;             /* scroll interno se pondrá más adelante en la lista de cartas */
    }

    /* -------------------------------------------------- CABECERA ------------------------------------------ */
    header {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 16px 28px;
      border-bottom: 2px solid var(--accent);       /* línea naranja, coherente con los bordes del tríptico */
      background: var(--bg);                       /* fondo negro, como los paneles de lobby.html */
      flex-shrink: 0;
    }
    header h1 {
      flex: 1;                /* ocupa el espacio disponible entre "volver" y las pestañas */
      text-align: center;     /* centrado */
      font-size: 24px;        /* más pequeño que el h1 normal de las otras pantallas */
      letter-spacing: 2px;
      color: var(--accent);
      margin: 0;               /* quita cualquier margen que el h1 general pudiera tener */
    }
    .volver-link {
      text-decoration: none;
      color: var(--accent);
      font-weight: bold;
      font-size: 13px;
      white-space: nowrap;
    }
    nav {                 /* zona de navegación de pestañas con botones */
      display: flex;      /* pone las pestañas en fila, una al lado de otra */
      gap: 8px;           /* separación entre ellas */
      margin-left: auto;  /* las empuja hacia la derecha del header */
    }

    /* -------------------------------------------------- BOTONES ------------------------------------------ */
    .tab-btn {
      background: #000000;                 /* mismo negro que .btn-menu */
      border: 2px solid var(--accent);       /* mismo borde naranja que .btn-menu */
      color: var(--text);                    /* texto claro */
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: bold;                     /* negrita, como el resto de botones */
      transition: all 0.15s;
    }
    .tab-btn:hover {
      background: var(--accent);
      color: #000000;
    }
    .tab-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #000000;
    }

    /* -------------------------------------------------- FILTROS ------------------------------------------ */
    .filters {
      padding: 14px 20px;               /* aire interior arriba/abajo y a los lados */
      background: var(--bg);              
      border-bottom: 2px solid var(--accent);    /* línea separadora con el catálogo que irá debajo */
      display: flex;                    /* todos los filtros en fila */
      flex-direction: column;
      flex-wrap: wrap;                  /* si la pantalla es estrecha, los filtros saltan a la línea siguiente en vez de desbordar */
      gap: 10px;                         /* separación entre cada filtro */
      flex-shrink: 0;                   /* esta barra nunca se encoge, aunque el catálogo de abajo necesite más espacio */
    }
    .filters-fila1 {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .filters-fila2 {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .separador {
      width: 4px;                 /* muy fina, como una línea */
      height: 24px;               /* altura similar a los botones/pills de al lado */
      background: var(--accent);  /* color naranja, para que combine con el resto */
      flex-shrink: 0;             /* nunca se encoge ni desaparece */
    }
    /* -------------------------------------- BUSCADOR DE TEXTO --------------------------------- */
    .search-wrap { /* buscador de texto como elemento en la cabecera */
      flex: 1;                /* el buscador "crece" para ocupar todo el espacio que sobra junto a los selects */
      min-width: 180px;      /* pero nunca se encoge por debajo de 180px, aunque falte sitio */
    }
    .search-wrap input { /* buscador de texto opciones css */
      width: 100%;                      /* ocupa todo el ancho de su contenedor (.search-wrap) */
      background: #f5f5f5;            /* gris muy clarito, para diferenciarlo del blanco de fondo */
      border: 1px solid #ccc;         /* borde sutil */
      border-radius: 6px;               /* esquinas redondeadas */
      color: #333;                    /* texto oscuro, legible sobre fondo claro */
      padding: 7px 10px;                /* aire interior del texto */
      font-family: inherit;             /* usa la misma fuente que el resto de la página */
      font-size: 13px;
      outline: none;                    /* quita el borde azul feo que pone el navegador al hacer clic */
    }
    .search-wrap input:focus {
      border-color: var(--accent);      /* cuando se escribe dentro, el borde se pone de color */
    }

    /* -------------------------------------- LISTAS --------------------------------- */
    .filters select {
      background: #f5f5f5;            /* mismo estilo que el buscador, para que combinen */
      border: 1px solid #ccc;
      border-radius: 6px;
      color: #333;
      padding: 7px 10px;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;                  /* cursor de mano, indica que es clicable */
      outline: none;
    }

    /* ------------------------------- BOTONES DE FILTRO PEQUEÑOS --------------------------------- */
    .filter-pills {
      display: flex;            /* las 3 pills (Personaje/Evento/Con habilidad) en fila */
      gap: 5px;                 /* separación pequeña entre ellas */
      flex-wrap: wrap;          /* saltan de línea si no caben */
    }
    .pill {
      padding: 4px 12px;                /* aire interior, más redondeado que un botón normal */
      border-radius: 6px;               
      border: 1px solid var(--accent);
      background: #000000;
      color: var(--text);                
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;            /* transición suave al cambiar de estado (hover, activo) */
      white-space: nowrap;              /* el texto de la pill nunca se parte en dos líneas */
    }
    .pill:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--text);                      /* texto un poco más oscuro */
    }
    .pill.on {
      background: var(--accent);          /* pill SELECCIONADA (clase "on" añadida por JS): fondo naranja sólido */
      border-color: var(--accent);
      color: var(--text);                 /* texto blanco para que resalte sobre el naranja */
    }
    /* ------------------------------- BOTÓN DE FILTRO RESET --------------------------------- */
    .pill-reset {
      padding: 4px 8px;                   /* mismo aspecto que una pill normal */
      border-radius: 50px;
      border: 1px solid #ccc;
      background: #000000;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;              /* como es un <button>, hay que decirle que use la fuente de la página (si no, usa la fuente por defecto del navegador) */
      white-space: nowrap;
    }
    .pill-reset:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--text);
    }

    /* ------------------------------- ESTILO CONTADOR Y GRID DE CARTAS --------------------------------- */
    .card-count {                         /* contador de cartas */
      font-size: 12px;
      color: #666;                      /* gris medio, discreto */
      padding: 8px 20px; 
      background: var(--bg);               
      /* border-bottom: 2px solid var(--accent);     separación con el grid de abajo */
      flex-shrink: 0;                     /* nunca se encoge */
    }
    .catalogue-grid {
      flex: 1;                          /* ocupa todo el espacio vertical que sobra */
      overflow-y: auto;                 /* scroll propio si hay muchas cartas */
      padding: 2px 20px;
      margin-right: 4px;
      display: grid;                    /* rejilla de miniaturas */
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); /* tantas columnas como quepan, mínimo 130px cada una */
      gap: 12px;                        /* separación entre miniaturas */
      align-content: start;             /* las cartas se agrupan arriba, no se estiran para llenar el alto */
    }

    /* ------------------------------- CARTAS EN MINIATURA --------------------------------- */
    .card-thumb { /* ------------------------------------- Caja negra de la carta */
      background: #000000;          /* color de fondo */
      border: 1px solid #ccc;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.12s, border-color 0.12s, box-shadow 0.12s;
      position: relative;
      display: flex;
      flex-direction: column;
      user-select: none;
      min-height: 230px;
    }
    .card-thumb:hover { /* ------------------------------------- Ratón por encima de la carta */
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 12px 12px rgba(0,0,0,.15); /* longitud vertical / desenfoque / (,,,,opacidad) */ 
    }
    .card-thumb.in-deck { /* ------------------------------------- Carta ya añadida al mazo */
      border-color: var(--accent);
      border-width: 2px;
    }
    .card-art { /* ------------------------------------- Contenedor de la carta */
      width: 100%;
      height: 196px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eee;           /* color de respaldo mientras la imagen carga o si falta */
    }
    .card-art img { /* ------------------------------------- Arte de la carta */
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card-esc-bar { /* ------------------------------------- Línea color escuela */
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 3px;
    }
    .card-info { /* ------------------------------------- Información de la carta */
      padding: 6px 8px;
      display: flex;
      align-items: center;              /* alinear nombre y posición en la misma línea */
      justify-content: space-between;
      gap: 6px;
    }
    .card-name { /* ------------------------------------- Nombre del personaje */
      font-size: 11px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;                         /* ocupa el espacio disponible */
    }
    .card-position {
      flex-shrink: 0;           /* nunca se encoge */
      color: white;              /* texto blanco */
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      line-height: 1.4;
    }

    .card-add-btn { /* ------------------------------------- Botón + para añadir al mazo  */
      position: absolute;
      top: 6px; right: 6px;
      width: 24px; height: 24px;
      background: rgba(0,0,0,.75);
      border: 1px solid var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
      color: white;
      transition: all 0.12s;
      z-index: 3;
    }
    .card-add-btn:hover {
      background: var(--accent);
    }

    .card-count-badge { /* ------------------------------------- Contador del número de cartas en el mazo  */
      position: absolute;
      top: 6px; left: 6px;
      background: var(--accent);
      color: white;
      font-size: 11px;
      font-weight: 700;
      width: 20px; height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
    }

    /* ----------------------------------------------------------------------------------------------------- */
    .preview-panel { /* --------------------------------------------------------- PANEL DE PREVIEW DE CARTAS */
      display: none;
      position: absolute;
      top: 50%;                /* margen desde arriba, para que no toque el borde */
      left: 10px;
      right: 10px;               /* margen a los lados, dentro de la columna de 260px */
      transform: translateY(-50%);
      flex-direction: column;
      background: var(--bg);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,.5);   /* sombra para que se note que "flota" encima */
      z-index: 5;
    }
    .preview-panel.show {
      display: flex;
    }
    .preview-imagen {
      width: 100%;
      height: 380px;                      /* tamaño grande, pero no toda la columna */
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
    }
    .preview-info {
      background: #000000;
      color: var(--text);
      padding: 14px;
      max-height: 260px;          /* límite de altura, con scroll si hace falta */
      overflow-y: auto;
    }
    .preview-info h3 {
      font-size: 15px;
      margin-bottom: 2px;
    }
    .preview-info .preview-meta {
      font-size: 11px;
      color: var(--text2);
      margin-bottom: 8px;
    }
    .preview-info .preview-stats {
      display: flex;               /* en fila, en vez de grid de 2 columnas */
      gap: 4px;
      margin-bottom: 8px;
    }
    .pstat {                        /* Posición y tamaño de cuadrados */
      flex: 1;                      /* los 5 cuadraditos se reparten el ancho por igual */
      text-align: center;
      padding: 4px 2px;
      border-radius: 4px;
      font-size: 10px;
    }
    .pstat span {                   /* Texto cuadrados */
      display: block;
      font-size: 8px;
      opacity: 0.8;
    }
    .pstat strong {                 /* Números cuadrados */
      display: block;
      font-size: 13px;
    }
    .pstat-saque     { background: rgba(230,81,0,.2);   color: #ff9248; }
    .pstat-recepcion { background: rgba(21,101,192,.2); color: #5b9bf5; }
    .pstat-pase      { background: rgba(46,125,50,.2);  color: #6fcf73; }
    .pstat-remate    { background: rgba(198,40,40,.2);  color: #ff6b6b; }
    .pstat-bloqueo   { background: rgba(66,66,66,.3);   color: #bbb; }

    .preview-info .preview-desc {
      font-size: 11px;
      line-height: 1.5;
      border-top: 1px solid var(--border2);
      padding-top: 8px;
    }

    /* ---------------------------------------------- BARRA DE SCROLL PERSONALIZADA ------------------------- */
    .catalogue-grid::-webkit-scrollbar {
      width: 10px;                    /* ancho de la barra */
    }
    .catalogue-grid::-webkit-scrollbar-track {
      background: var(--bg);          /* fondo del "carril" por donde se desliza */
    }
    .catalogue-grid::-webkit-scrollbar-thumb {
      background: var(--accent);      /* color de la barra */
      border-radius: 6px;             /* esquinas redondeadas */
    }
    .catalogue-grid::-webkit-scrollbar-thumb:hover {
      background: #000000;            /* se oscurece un poco al pasar el ratón por encima */
      border: 2px solid var(--accent);
    }

  </style>
</head>
<body>
  <!-- CONTENEDOR PRINCIPAL -->
  <div class="triptico">
    <!-- COLUMNA IZQUIERDA : solo imagen -->
    <div id="columna-izquierda">
      <div class="preview-panel" id="previewPanel">
        <div class="preview-imagen" id="previewImagen"></div>
        <div class="preview-info" id="previewInfo"></div>
      </div>
    </div>

    <!-- COLUMNA CENTRAL : FILTROS + CATÁLOGO -->
    <div class="columna-central">
      <!------------------------ CABECERA ------------------------------------>
      <header>
        <a href="index.html" class="volver-link" data-i18n="lobby.volverInicio">← Volver a inicio</a>
        <h1 data-i18n="menu.btnDeckbuilder">Deckbuilder</h1>
        <nav>
          <button class="tab-btn active" id="tab-builder" onclick="setTab('builder')" data-i18n="deckbuilder.tabConstructor">Constructor</button>
          <button class="tab-btn" id="tab-predefined" onclick="setTab('predefined')" data-i18n="deckbuilder.tabPredefinidos">Decks predefinidos</button>
        </nav>
      </header> <!-- fin cabecera -->
      <!------------------------ FILTROS ------------------------------------>
      <div class="filters">
        <div class="filters-fila1">
          <div class="search-wrap">
            <input type="text" id="searchInput" placeholder="Buscar carta..." data-i18n-placeholder="deckbuilder.buscarPlaceholder">
          </div>
          <select id="filterEscuela">
            <option value="" data-i18n="deckbuilder.todasEscuelas">Todas las escuelas</option>
          </select>
          <select id="filterPosicion">
            <option value="" data-i18n="deckbuilder.todasPosiciones">Todas las posiciones</option>
            <option value="MB">MB — Middle Blocker</option>
            <option value="S">S — Setter</option>
            <option value="WS">WS — Wing Spiker</option>
            <option value="L">L — Libero</option>
          </select>
          <select id="filterRareza">
            <option value="" data-i18n="deckbuilder.todasRarezas">Todas las rarezas</option>
            <option value="DP">DP</option><option value="TP">TP</option><option value="S">S</option>
            <option value="R">R</option><option value="RP">RP</option><option value="T">T</option>
            <option value="N">N</option><option value="NP">NP</option><option value="P">P</option><option value="D">D</option>
          </select>
        </div>

        <div class="filters-fila2">
          <button class="pill-reset" title="Resetear filtros" data-i18n-title="deckbuilder.resetearFiltros">✕</button>
          <div class="filter-pills">
            <span class="pill" data-filter="tipo" data-val="personaje" data-i18n="deckbuilder.pillPersonaje">Personaje</span>
            <span class="pill" data-filter="tipo" data-val="evento" data-i18n="deckbuilder.pillEvento">Evento</span>
          </div>
          <span class="separador"></span>
          <div class="filter-pills">
            <span class="pill" data-filter="hab" data-val="si" data-i18n="deckbuilder.pillHabilidad">Con habilidad</span>
            <span class="pill" data-filter="hab" data-val="no" data-i18n="deckbuilder.pillSinHabilidad">Sin habilidad</span>
          </div>
          <span class="separador"></span>
          <select id="filterStat" class="select-oscuro">
            <option value="" data-i18n="deckbuilder.filtrarPorStat">Filtrar por estadística...</option>
            <option value="saque" data-i18n="deckbuilder.statSaque">Saque</option>
            <option value="recepcion" data-i18n="deckbuilder.statRecepcion">Recepción</option>
            <option value="pase" data-i18n="deckbuilder.statPase">Pase</option>
            <option value="remate" data-i18n="deckbuilder.statRemate">Remate</option>
            <option value="bloqueo" data-i18n="deckbuilder.statBloqueo">Bloqueo</option>
          </select>

            <div class="filter-pills" id="statValuePills">
              <!-- se rellenan dinámicamente por JS con los valores 0-6 -->
            </div>
        </div>
      </div> <!-- fin filtros -->

      <!------------------------ CONTADOR DE RESULTADOS ------------------------------------>
      <div class="card-count" id="cardCount">Cargando catálogo...</div>

      <!------------------------ GRID DE CARTAS ------------------------------------>
      <div class="catalogue-grid" id="catalogueGrid"></div>

    </div> <!-- fin columna central -->

    <!-- COLUMNA DERECHA:  nombre del mazo, estadísticas, lista de cartas del mazo -->
    <div class="columna-derecha">
      <p style="padding:20px;">(aquí irá el panel del mazo actual)</p> <!-- placeholder temporal -->
    </div>

  </div>

  <!------------------ STUBS Y CREAR CARTA (necesario, aunque no se lance, para poder crear cartas ------------------------>
  <script> // -------------------------- STUBS -------------------------------------------
    function usarGuts()               { return false; }
    function robarCarta()             {}
    function añadirCartaAMano()       {}
    function pagarConEvento()         { return false; }
    function negarBloqueadoresApoyo() {}
    function negarReceptorAlto()      {}
    function debilitarRematador()     {}
    function tendoSatori()            {}
    function kageyamaSP()              {}
    function doshat()                  {}
    function blockout()                 {}
    function renderMano()               {}
    function renderCampo()              {}
    function actualizarFaseUI()         {}
    function log()                       {}

    // versión de crearCarta que extrae solo los datos que necesita el deckbuilder
    function crearCarta(nombre, stats, habilidadFn, info) {
      return {
        nombre,
        stats,
        habilidad:       typeof habilidadFn === 'function',
        tipo:            info.tipo            || 'personaje',
        id:              info.id              || '',
        escuela:         info.escuela         || '',
        posicion:        info.posicion        || null,
        rareza:          info.rareza          || 'N',
        anyo:            info.anyo            || null,
        fases:           info.fases           || [],
        descripcion:     info.descripcion     || '',
        zonasProhibidas: info.zonasProhibidas || [],
      };
    }
  </script>

  <!------------------------------------------------ CATÁLOGO DE CARTAS ------------------->
  <script src="cartas.js"></script>
  <script src="descripciones.js"></script>

  <script src="i18n.js"></script>

  <script>
    // -------------------------------------------------- APLICAR COLOR AL GUARDADO DE PÁGINA ------------------------------------------ 
    // recupera el color de acento que el usuario eligió en Settings (index.html)
    const colorGuardado = localStorage.getItem("hv-accent");
    if (colorGuardado) {                                                        // si hay un color guardado de una sesión anterior
      document.documentElement.style.setProperty("--accent", colorGuardado);    // lo aplica a la variable CSS --accent
    }

    // ---------------------------------------------- CAMBIAR DE PESTAÑA ------------------------------------------- 
    function setTab(tab) {
      document.getElementById("tab-builder").classList.toggle("active", tab === "builder");
      document.getElementById("tab-predefined").classList.toggle("active", tab === "predefined");
      // de momento no cambiamos contenido, solo el estado visual del botón
    }

    // ---------------------------------------------- CARTAS ------------------------------------------- 
    const CATALOGUE = inicializarCartas();          // carga todas las cartas desde cartas.js
    const imgPath = id => `img/cartas/${id}.png`;   // ruta de la imagen de cada carta

    // ------------------------------------- RENDER DEL GRID (sin filtros todavía, solo mostrar todo) 
    function renderCatalogo(lista) {
      document.getElementById("cardCount").textContent = `${lista.length} cartas`;
      const grid = document.getElementById("catalogueGrid");
      grid.innerHTML = "";
      lista.forEach(c => grid.appendChild(buildCardThumb(c)));
    }

    // ------------------------------------- COLORES ESCUELAS
    function getSchoolColor(escuela) {
      const colores = {
        Karasuno:        '#E8761A',
        Nekoma:          '#C62828',
        Fukurodani:      '#D4AF37',
        Shiratorizawa:   '#6A1B9A',
        Inarizaki:       '#5C0A1E',
        Kamomedai:       '#4a9ee6',
        Itachiyama:      '#F9A825',
        'Wakutani Minami': '#E91E8C',
        'Date Kôgyô':    '#0F5C3D',
        'Aoba Jôsai':      '#1AA6A0',
        Tokonami:         '#4A7FA5',
        Ohgiminami:         '#2C3E70',
        Kakugawa:         '#7CB342',
        'Sarukawa Kōgyō':         '#2E3A6E',
        Tsubakihara:         '#C9A63C',
      };
      return colores[escuela] || '#999999';   // gris por defecto si no coincide ninguna
    }

    // ------------------------------------- CONSTRUIR MINIATURA DE CARTA
    function buildCardThumb(c) {
      const div = document.createElement("div");
      div.className = "card-thumb";
      div.dataset.id = c.id;

      const colorEscuela = getSchoolColor(c.escuela);  // color escuela
      div.style.border = `2px solid ${colorEscuela}`;

      div.innerHTML = `
        <div class="card-art">
          <img src="${imgPath(c.id)}" alt="${c.nombre}" onerror="this.style.display='none'">
          <div class="card-esc-bar" style="background:${colorEscuela}"></div>
        </div>
        <button class="card-add-btn" title="Añadir al deck">+</button>
        <div class="card-info">
          <div class="card-name" title="${c.nombre}">${c.nombre}</div>
          ${c.posicion ? `<span class="card-position" style="background:${colorEscuela}">${c.posicion}</span>` : ''}
        </div>`;

      // ------------------------------------------------------------------- Mostrar tooltip al pasar el ratón   
      div.addEventListener("mouseenter", () => mostrarPreview(c));
      div.addEventListener("mouseleave", () => ocultarPreview());

      return div;
    }

    // ------------------------------------- MOSTRAR TOOLTIP
    function mostrarPreview(c) {
      const panel   = document.getElementById("previewPanel");
      const imagen  = document.getElementById("previewImagen"); 
      const info    = document.getElementById("previewInfo");
      const colorEscuela = getSchoolColor(c.escuela);

      imagen.style.backgroundImage = `url('${imgPath(c.id)}')`;   // imagen de fondo
      panel.style.border = `3px solid ${colorEscuela}`;           // borde del color de la escuela
      imagen.style.borderBottom = `5px solid ${colorEscuela}`;    // línea del color de la escuela

      const descripcion = DESCRIPCIONES?.[c.id]?.[idiomaActivo] || c.descripcion || "";

      info.innerHTML = `
        <h3 style="color:${colorEscuela}">${c.nombre}</h3>
        <div class="preview-meta">${c.escuela || (c.tipo === 'evento' ? 'Evento' : '')} ${c.posicion ? '· ' + c.posicion : ''}</div>
        ${c.tipo === 'personaje' ? `
          <div class="preview-stats">
            <div class="pstat pstat-saque"><span>${t("deckbuilder.statSaqueCorto")}</span><strong>${c.stats.saque}</strong></div>
            <div class="pstat pstat-bloqueo"><span>${t("deckbuilder.statBloqueoCorto")}</span><strong>${c.stats.bloqueo}</strong></div>
            <div class="pstat pstat-recepcion"><span>${t("deckbuilder.statRecepcionCorto")}</span><strong>${c.stats.recepcion}</strong></div>
            <div class="pstat pstat-pase"><span>${t("deckbuilder.statPaseCorto")}</span><strong>${c.stats.pase}</strong></div>
            <div class="pstat pstat-remate"><span>${t("deckbuilder.statRemateCorto")}</span><strong>${c.stats.remate}</strong></div>
          </div>` : ''}
        <div class="preview-desc">${descripcion.replace(/&quot;/g, '"')}</div>
      `;

      panel.classList.add("show");
    }

    // ------------------------------------- OCULTAR TOOLTIP
    function ocultarPreview() {
      document.getElementById("previewPanel").classList.remove("show");
    }

    // ----------------------------------------------------------------------------------------- FILTROS //
        // ------------------------------------- RELLENAR LISTA ESCUELAS
    function llenarListaEscuela() {
      const escuelas = [...new Set(CATALOGUE.map(c => c.escuela).filter(Boolean))].sort();  // escuelas únicas, sin vacíos, ordenadas
        // CATALOGUE.map(c => c.escuela) → saca un array con la escuela de CADA carta (con repetidos)
        // .filter(Boolean) → quita los valores vacíos/null/undefined (p.ej. cartas sin escuela, como algunos eventos)
        // new Set(...) → convierte el array en un "conjunto" que elimina automáticamente los duplicados
        // [...] → vuelve a convertirlo en un array normal para poder usar .sort()
        // .sort() → ordena alfabéticamente

      const select = document.getElementById("filterEscuela");      // crear la lista HTML
      escuelas.forEach(e => {                                       // por cada opción
        const option = document.createElement("option");            // crea el valor
        option.value = e;                                           // valor interno para el filtro
        option.textContent = e;                                     // valor asociado al texto
        select.appendChild(option);
      });
    }
    // ------------------------------------- ESTADO FILTROS
    let activeFilters = { tipo: null, hab: null };                   // para los pills (tipo: "personaje"/"evento", hab: "si")
    // ------------------------------------- APLICAR FILTROS
    function applyFilters() {                                        // leer todos los filtros
      const q        = document.getElementById("searchInput").value.toLowerCase().trim();
      const escuela  = document.getElementById("filterEscuela").value;
      const posicion = document.getElementById("filterPosicion").value;
      const rareza   = document.getElementById("filterRareza").value;

      const resultado = CATALOGUE.filter(c => {                        // mostrar o no según se encuentre en el filtro
        if (q        && !c.nombre.toLowerCase().includes(q) && !(c.id||'').toLowerCase().includes(q)) return false; // texto escrito en el buscador
        if (escuela  && c.escuela  !== escuela)  return false;
        if (posicion && c.posicion !== posicion) return false;
        if (rareza   && c.rareza   !== rareza)   return false;
        if (activeFilters.tipo && c.tipo !== activeFilters.tipo) return false;  // filtro personaje/evento
        if (activeFilters.hab === "si" && !c.habilidad) return false;           // filtro con habilidad
        if (activeFilters.hab === "no" && c.habilidad)  return false;           // filtro sin habilidad

        // ------------------------ FILTRO POR ESTADÍSTICAS
        if (statFiltro.stat && statFiltro.valores.size > 0) {
          const valorCarta = c.stats?.[statFiltro.stat];              // valor de esa stat en esta carta
          if (!statFiltro.valores.has(valorCarta)) return false;      // si no está entre los valores marcados, descartar
        }

        return true;
      });
      renderCatalogo(resultado);                                                // repintar el catálogo
    }
    // ------------------------------------- TOOGLES DE PILLS DE FILTROS
    function togglePill(el) {
      const filtro = el.dataset.filter;                         // lee el atributo del pill tipo
      const valor  = el.dataset.val;                            // lee el atributo del pill 
      const estabaActiva = el.classList.contains("on");

      // desactivar visualmente todas las pills del mismo grupo de filtro
      document.querySelectorAll(`.pill[data-filter="${filtro}"]`).forEach(p => p.classList.remove("on"));

      activeFilters[filtro] = estabaActiva ? null : valor;      // si ya estaba activa, se desactiva; si no, se activa
      if (!estabaActiva) el.classList.add("on");

      applyFilters();
    }
    // ------------------------------------- RESETEAR FILTROS
    function resetFiltros() {
      document.getElementById("searchInput").value = "";
      document.getElementById("filterEscuela").value = "";
      document.getElementById("filterPosicion").value = "";
      document.getElementById("filterRareza").value = "";
      document.getElementById("filterStat").value = "";
      activeFilters = { tipo: null, hab: null };
      statFiltro = { stat: "", valores: new Set() };
      renderStatValuePills();
      document.querySelectorAll(".pill.on").forEach(p => p.classList.remove("on"));
      applyFilters();
    }

    // ------------------------------------- FILTRO POR ESTADÍSTICA
    let statFiltro = { stat: "", valores: new Set() };   // stat elegido + valores marcados

    // ------------------------------------- RELLENAR PILLS DE VALORES
    function renderStatValuePills() {
      const contenedor = document.getElementById("statValuePills");
      contenedor.innerHTML = "";

      if (!statFiltro.stat) return; // si no hay stat seleccionada, no mostrar nada

      for (let v = 0; v <= 6; v++) {
        const pill = document.createElement("span");
        pill.className = "pill" + (statFiltro.valores.has(v) ? " on" : "");
        pill.textContent = v;
        pill.addEventListener("click", () => toggleStatValue(v));
        contenedor.appendChild(pill);
      }
    }
    // // ------------------------------------- AL CAMBIAR DE ESTADÍSTICA
    document.getElementById("filterStat").addEventListener("change", function() {
      statFiltro.stat = this.value;
      statFiltro.valores.clear();   // al cambiar de stat, se resetean los valores marcados
      renderStatValuePills();
      applyFilters();
    });
    // ------------------------------------- PILLS DE UN VALOR CONCRETO
    function toggleStatValue(v) {
      if (statFiltro.valores.has(v)) {
        statFiltro.valores.delete(v);   // ya estaba marcado → lo quitamos
      } else {
        statFiltro.valores.add(v);      // no estaba → lo añadimos
      }
      renderStatValuePills();
      applyFilters();
    }

    // ------------------------------------- VINCULAR BOTONES CON FUNCIONES DE FILTRO
    document.getElementById("searchInput").addEventListener("input", applyFilters);
    document.getElementById("filterEscuela").addEventListener("change", applyFilters);
    document.getElementById("filterPosicion").addEventListener("change", applyFilters);
    document.getElementById("filterRareza").addEventListener("change", applyFilters);
    document.querySelectorAll(".pill").forEach(p => p.addEventListener("click", () => togglePill(p)));
    document.querySelector(".pill-reset").addEventListener("click", resetFiltros);

    llenarListaEscuela();
    applyFilters();  
  </script>

</body>
</html>
