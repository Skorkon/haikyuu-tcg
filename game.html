<!DOCTYPE html>  <!-- Le dice al navegador que esto es HTML moderno -->

<style>
  * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
/* ----------------------------------------------------------------------------------------------- REMAKE : PASO 1 */
:root {
  --bg: #f2f0e8;              /* fondo gris clarito, papel de manga */
  --surface: #16161a;         /* superficie oscura de paneles */
  --surface2: #1e1e24;        /* superficie secundaria (inputs) */
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --text: #e8e8ec;            /* texto claro (sobre fondos oscuros) */
  --text2: #9090a0;           /* texto gris apagado */
  --accent: #E8761A;          /* naranja de marca */
  --font-body: 'Noto Sans JP', sans-serif;
}

body {
  font-family: var(--font-body), Arial, sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--bg);      /* ← antes #d0d0d0, ahora el gris clarito de toda la app */
}


/* -------------------------------------------------- ZONA PRINCIPAL */
.main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* -------------------------------------------------- IZQUIERDA */
.panel-izquierda {
  width: 30%;
  background: var(--bg);        /* ← antes #f2f2f2 */
  padding: 10px;
  overflow-y: auto;
  border-right: 2px solid var(--accent);   
  display: flex;
  flex-direction: column;
  margin-top: auto;
}

.panel-acciones {
  height: 150px;
  overflow-y: auto;
}

/* -------------------------------------------------- DERECHA */
.panel-derecha {
  width: 20%;
  background: var(--bg);        /* ← antes #f9f9f9 */
  padding: 10px;
  overflow-y: auto;
  border-left: 2px solid var(--accent);    
  display: flex;
  flex-direction: column;
}

.panel {
  margin-bottom: 15px;
  padding: 10px;
  background: var(--bg);          /* ← antes white, ahora negro (paneles estilo deckbuilder) */
  /* border: 2px solid var(--accent); */
  border-radius: 8px;
  color: var(--text);            /* texto claro sobre fondo negro */
}

/* ----------------------------------------------------------------------------------------------- REMAKE : PASO 2 */
.panel h3 {
  color: var(--accent);
  font-size: 13px;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 10px;
}

.panel button {
  display: block;
  width: 100%;
  margin: 6px 0;
  padding: 9px;
  background: #000000;
  border: 2px solid var(--accent);
  border-radius: 8px;
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.15s;
}

.panel button:hover {
  background: var(--accent);
  color: #000000;
}

.panel button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.mano-bottom {
  background: var(--bg);
  /* border: 2px solid var(--accent); */
  border-radius: 8px;
  padding: 12px;
  text-align: center;
}

/* ----------------------------------------------------------------------------------------------- REMAKE : PASO 3 Columna derecha */
.panel-derecha h3 {
  color: var(--accent);
  font-size: 13px;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 10px;
}

#log-container {
  border-bottom: 2px solid var(--accent) !important;   /* sustituye el #ccc inline del HTML */
  border: 2px solid var(--accent);
  border-radius: 8px;
}

#log {
  font-size: 12px;
  line-height: 1.5;
}

#selector-cartas {
  background: #000000;
  color: var(--text);
  border-radius: 8px;
}

#selector-cartas button {
  background: #000000;
  border: 2px solid var(--accent);
  border-radius: 8px;
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  font-weight: bold;
  padding: 9px;
  cursor: pointer;
  transition: all 0.15s;
}

#selector-cartas button:hover {
  background: var(--accent);
  color: #000000;
}

#selector-mano {

  flex-wrap: nowrap;      /* ← cambia esto: nunca salta de línea */
  overflow-x: auto;        /* scroll horizontal si no caben todas */

  /* -------------------- BARRA DE SCROLL PERSONALIZADA  ------------------------- */
  /* ── SCROLLBAR PANEL IZQUIERDA ────────────────────────────── */
.panel-izquierda::-webkit-scrollbar { width: 6px; }
.panel-izquierda::-webkit-scrollbar-track { background: var(--bg); }
.panel-izquierda::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 6px; }
.panel-izquierda::-webkit-scrollbar-thumb:hover { background: #000000; border: 2px solid var(--accent); }

/* ── SCROLLBAR PANEL DERECHA ──────────────────────────────── */
.panel-derecha::-webkit-scrollbar { width: 6px; }
.panel-derecha::-webkit-scrollbar-track { background: var(--bg); }
.panel-derecha::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 6px; }
.panel-derecha::-webkit-scrollbar-thumb:hover { background: #000000; border: 2px solid var(--accent); }
  
  #log-container::-webkit-scrollbar {
    width: 6px;
  }

    background: var(--bg);
  }
  #log-container::-webkit-scrollbar-thumb {
    background: var(--accent);
    border-radius: 6px;
  }

/* -------------------------------------------------- CARTAS */
.carta {

}

}

/* -------------------------------------------------- PREVIEW */
.preview {

/* -------------------------------------------------- MARCADOR */

/* -------------------------------------------------- TOOLTIP */
.tooltip {

.lado {

.red {

button {

/* --------------------------------------------------------------------------------- NUEVA CANCHA */
.cancha-rect {
  position: absolute;
  display: grid;
  grid-template-columns: repeat(3, 80px);
  grid-template-rows: 112px 16px 112px;
  gap: 6px;
  padding: 8px;
  border: 5px solid white;
  border-radius: 0px;
  background: #E8761A;   /* fondo ligeramente distinguible del resto de la cancha */
}

  /* posición del rectángulo dentro de cada .lado-jugador — ajusta estos valores según el resto de tus zonas */
  #cancha-j1 { top: 0px; left: 170px; }
  #cancha-j2 { top: -20px; left: 170px; }

  .cancha-rect .zona {
  position: relative;   /* dentro del grid, no queremos position:absolute */
  top: auto;
  left: auto;
}

  /* la línea divisoria, ocupa toda la fila del medio */
  .cancha-rect::before {
    content: "";
    grid-column: 1 / 4;    /* ocupa las 3 columnas */
    grid-row: 2;            /* la fila del medio */
    height: 6px;
    background: white;
    align-self: center;
    margin: 0 -8px;
  }

  #cancha-j1 {
    top: 0px;
    left: 170px;
    border-top: none;    /* ← quita el borde que mira hacia la red */
  }

  #cancha-j2 {
    top: -20px;
    left: 170px;
    border-bottom: none;  /* ← quita el borde que mira hacia la red */
    z-index: 2;
  }

  .cancha-conector {
    position: absolute;
    left: 170px;              /* mismo left que #cancha-j1/j2, ahora sí en el mismo sistema de coordenadas */
    top: -40px;                 /* sube por encima del propio #campo-j1, para tapar el hueco hacia la red */
    width: 277px;               /* ancho recalculado con box-sizing: border-box */
    height: 40px;
    background: #E8761A;
    border-left: 5px solid white;
    border-right: 5px solid white;
    z-index: 1;
  }

  .cancha-marco {
    position: absolute;
    left: 18%;      
    width: 57%;      
    top: -30px;         
    height: 1200px;       
    bottom: 0;
    background: rgb(185, 185, 185);   /* gris del marco */
    border: 8px solid white;
    z-index: 0;    /* por detrás de todo lo demás */
  }

  .fase-tracker {
    position: absolute;
    bottom: 20px;
    right: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    z-index: 20;
  }

  .fase-barra {
    width: 80px;
    padding: 3px 6px;
    background: #999999;    /* gris por defecto, fase inactiva */
    border: 2px solid #777777;
    border-radius: 4px;
    color: white;
    font-size: 9px;
    font-weight: bold;
    text-align: center;
  }

  .fase-flecha {
    font-size: 8px;
    color: #999999;
    line-height: 1;
  }

  /* ── FASE ACTIVA: color de esa fase + borde más grueso ── */
  .fase-barra.activa {
    border-width: 3px;
  }
  .fase-barra[data-fase="saque"].activa      { background: #f26a00; border-color: #e65100; }
  .fase-barra[data-fase="robo"].activa       { background: #9c27b0; border-color: #7b1fa2; }
  .fase-barra[data-fase="recepcion"].activa  { background: #2b6bc4; border-color: #1565c0; }
  .fase-barra[data-fase="pase"].activa       { background: #3d9142; border-color: #2e7d32; }
  .fase-barra[data-fase="remate"].activa     { background: #d94040; border-color: #c62828; }
  .fase-barra[data-fase="bloqueo"].activa    { background: #3a3a3a; border-color: #212121; }


</style>
