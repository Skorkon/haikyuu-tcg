<!DOCTYPE html> <!-- documento HTML5 -->
<html lang="es">
<head>
  <link rel="icon" type="image/png" href="favicon.png">                   <!-- icono navegador -->
  <meta charset="UTF-8">                                                  <!-- codificación de caracteres -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <!-- responsive básico -->
  <title>HV-SIM · Lobby</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="base.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; } /* reset básico */
    :root {
      --surface: #16161a;
      --surface2: #1e1e24;
      --border: rgba(255,255,255,0.07);
      --border2: rgba(255,255,255,0.13);
      --text: #e8e8ec;
      --text2: #9090a0;
    }
    body {
      background: var(--bg);           /* fondo general */
      color: var(--tinta);
      font-family: var(--font-texto);
      min-height: 100vh;               /* toda la altura de pantalla */
      display: flex;                   /* flexbox para centrar */
      flex-direction: column;          /* apilado vertical */
      align-items: center;             /* centrado horizontal */
      justify-content: center;         /* centrado vertical */
    }

    /* ------------------------------- TRÍPTICO ------------------------------------- */
    .triptico {
      display: flex;
      width: 100%;
      height: 100vh;
      position: fixed;   /* fijo en toda la pantalla, detrás del contenido */
      top: 0;
      left: 0;
    }

    #columna-izquierda {
      width: 20%;                /* siempre el 20%, como en deckbuilder */
      flex-shrink: 0;            /* nunca se encoge aunque falte espacio */
      background-image: url('img/fondos/lobby_columna_izquierda.jpg');
      background-color: #1a1a2e; /* color de respaldo mientras no hay imagen */
      background-size: cover;    /* la imagen cubre toda la columna sin deformarse */
      background-position: center;
      background-repeat: no-repeat;
      border-right: 3px solid var(--accent); /* línea naranja hacia el centro */
    }

    .columna-central {
      flex: 1;                   /* ocupa todo el espacio que sobra entre izquierda y derecha */
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;          /* el scroll irá dentro, no en la columna entera */
    }

    #columna-derecha {
      width: 35%;                /* más ancha que antes */
      flex-shrink: 0;            /* nunca se encoge */
      background: var(--bg);
      border-left: 3px solid var(--accent);
      display: flex;
      flex-direction: column;
      padding: 20px;
      overflow-y: auto;
    }

    .central-contenido {
      width: 750px;        /* ancho fijo de diseño */
      margin: 0 auto;      /* centrado horizontal */
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    /* ------------------------------- RESPONSIVE ------------------------------------- */
    @media (max-width: 900px) {
      .columna-lateral { display: none; }  /* ocultar laterales en pantallas pequeñas */
      .columna-central { width: 100%; }    /* panel central ocupa toda la pantalla */
    }

    /* ------------------------------- ESTILOS COMPARTIDOS ------------------------------------- */
    h1 {
      font-family: 'Anton', sans-serif;
      font-weight: 400;
      font-size: 32px;
      letter-spacing: 3px;
      color: var(--tinta);
      -webkit-text-stroke: 3px var(--accent);
      paint-order: stroke fill;
      margin-bottom: 20px;
    }
    h2 {
      font-size: 16px;
      color: var(--tinta);
      margin-bottom: 10px;
    }
    .btn-menu {
      display: block;
      text-decoration: none;
      text-align: center;
      font-size: 15px;
      padding: 4px 12px;
    }
    .input-settings {
      width: 100%;
      padding: 10px;
      background: var(--tinta);
      border: 2px solid var(--accent);
      border-radius: 0;
      color: var(--papel);
      font-size: 15px;
      font-family: var(--font-texto);
      outline: none;
    }

    /* ------------------------------- PROPIO AL LOBBY ------------------------------------- */

    #codigo-sala {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 4px;
      color: var(--accent);
    }

    .select-oscuro {
      background: var(--tinta);
      border: 2px solid var(--accent);
      border-radius: 0;
      color: var(--papel);
      padding: 7px 10px;
      font-family: var(--font-texto);
      font-size: 13px;
      cursor: pointer;
      outline: none;
    }

    /* cabecera de la columna central: botón izquierda, título centrado */
    header {
      position: relative;           /* referencia para centrar el título */
      display: flex;
      align-items: center;
      padding: 18px 28px;
      border-bottom: 2px solid var(--accent);  /* línea  separadora */
      background: var(--bg);
      flex-shrink: 0;               /* nunca se encoge */
      min-height: 60px;
    }

    header h1 {
      position: absolute;
      left: 50%;                    /* borde izquierdo en el centro... */
      transform: translateX(-50%);  /* ...retrocede la mitad de su ancho: centrado exacto */
      margin: 0;
      text-align: center;
      font-family: 'Anton', sans-serif;
      font-weight: 400;
      font-size: 28px;
      letter-spacing: 3px;
      line-height: 1;
      color: var(--tinta);
      -webkit-text-stroke: 3px var(--accent);  /* contorno de tu color */
      paint-order: stroke fill;                /* el contorno se pinta detrás del relleno */
    }

    .volver-link {
      display: inline-block;
      padding: 8px 14px;
      font-size: 11px;
      white-space: nowrap;
      text-decoration: none;
      text-transform: uppercase;    /* como los botones */
    }


    /* ------------------------------- LISTA DE PARTIDAS ------------------------------------- */
    .partida-item {
      background: var(--tinta);
      border: 2px solid var(--accent);
      box-shadow: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 7px 16px;
      margin-bottom: 6px;
    }

    .partida-nombre {
      font-size: 12px;
      color: var(--papel);
    }

    .sin-partidas {
      font-size: 12px;
      color: var(--text2);
      text-align: center;
      padding: 12px 0;
    }

    .btn-mini {
      padding: 5px 12px;
      width: auto;
      flex: none;
      font-size: 11px;
    }

    /* tres zonas de la columna central */
    .zona-mazo {
      flex: 0;                          /* ocupa el espacio disponible */
      padding: 5px 20px;
      display: flex;
      flex-direction: column;
      gap: 1px;
                  min-height: 100px;

    }

    .zona-mazo h2 {
      color: var(--accent);             /* título en naranja, sin fondo */
      font-family: 'Anton', sans-serif;
      font-size: 20px;
      letter-spacing: 2px;
    }

    .divisor {
      height: 2px;
      background: var(--accent);
      flex-shrink: 0;
      margin: 0;
    }

    .zona-botones {
      padding: 16px 28px 1px;
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 12px;
      flex-shrink: 0;
    }

    .zona-botones .btn-menu {
      padding: 10px 14px;
      font-size: 14px;
    }

    .deck-section-title {                           /* Your DECK */
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--text2);
      padding: 8px 1px 4px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .estado-mazo { /* ==================================================== ESTADO DEL MAZO */
      font-size: 14px;
      color: var(--accent);
      margin-left: 8px;
    }

    .zona-botones-titulo { /* ============================================ TITULO GRIS DE LA ZONA DE BOTONES */
      width: 100%;
      margin-bottom: 0;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--text2);
      text-transform: uppercase;
    }

    .sala-codigo {
      font-size: 24px;
      margin: 0;
      padding: 4px 0;
    }

    .sala-estado {
      font-size: 13px;
      margin: 0;
      padding: 2px 0;
    }

    .zona-sala {
      padding: 0 28px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .partida-item .btn-opcion {
      padding: 4px 10px;
      font-size: 11px;
    }
  </style>
</head>

<body>
  <!-- FONDO TRÍPTICO -->
  <div class="triptico">
    <!-- COLUMNA IZQUIERDA: SOLO IMAGEN -->
    <div class="columna-lateral" id="columna-izquierda"></div>

    <!-- COLUMNA CENTRAL -->
    <div class="columna-central">
      <header>
        <a href="index.html" class="btn-menu volver-link" data-i18n="lobby.volverInicio">← Inicio</a>
        <h1 class="titulo-caja" data-i18n="menu.btnJugar">Play</h1>
      </header>

      <div class="central-contenido">

        <!-- ZONA MAZO -->
        <div class="zona-mazo">
          <div class="deck-section-title" data-i18n="lobby.tituloMazo">Your deck</div>

        <div style="display:flex; gap:8px; align-items:center;">
          <select id="savedDecksSelectLobby" class="select-oscuro" style="width:50%;" onchange="cargarMazoGuardado(this.value)">
            <option value="" data-i18n="lobby.elegirMazoGuardado">Elige un mazo guardado...</option>
          </select>
          <label for="input-mazo" class="btn-menu volver-link" style="cursor:pointer;">Importar</label>
            <input type="file" id="input-mazo" accept=".json" style="display:none;">
          <p id="estado-mazo" class="estado-mazo"></p>
        </div>
        </div>

        <div class="divisor"></div>

        <!-- ZONA BOTONES -->
        <div class="zona-botones">
          <div class="zona-botones-titulo" data-i18n="lobby.tituloCrear">Create</div>
          <button id="btn-crear" class="btn-menu" ...>New match</button>
          <button class="btn-menu" disabled>Solo</button>
          <button class="btn-menu" disabled>Ranked</button>
        </div>
        <div class="zona-sala">
          <p id="codigo-sala" class="sala-codigo" style="display:none"></p>
          <p id="estado-sala" class="sala-estado"></p>
        </div>

        <div class="divisor" style="margin-top: 20px;"></div>
      <!-- ZONA PARTIDAS ABIERTAS -->
      <div class="zona-botones" style="flex-direction: column;">
        <div class="zona-botones-titulo" data-i18n="lobby.tituloPartidas">Open matches</div>
        <div id="lista-partidas" data-i18n="lobby.buscandoPartidas">Buscando partidas...</div>
      </div>

      </div> <!-- fin central-contenido -->

    </div> <!-- fin columna central -->

    <!-- COLUMNA DERECHA: BUSCAR / UNIRSE A PARTIDA -->
    <div class="columna-lateral" id="columna-derecha">
      <!-- PANEL: unirse con código -->
      <div class="panel">
        <h2 data-i18n="lobby.tituloUnirse">Unirse con código</h2>
        <input type="text" id="input-codigo" placeholder="Ej: XK7F2A" maxlength="6" class="input-settings" style="margin-bottom:10px;">
        <button id="btn-unirse" class="btn-menu" data-i18n="lobby.btnUnirse">Unirse</button>
      </div>
    </div> <!-- fin columna derecha -->
  </div> <!-- fin triptico -->

  <script>
    // =============================================================== APLICAR COLOR GUARDADO AL CARGAR PÁGINA
    const colorGuardado = localStorage.getItem("hv-accent");
    if (colorGuardado) {
      document.documentElement.style.setProperty("--accent", colorGuardado);
    }
  </script>

  <script>
    // ====================================================== ESCALAR COLUMNA IZQUIERDA
    const ANCHO_DISENO_IZQ = 380;
    function escalarIzquierda() {
      const columna = document.getElementById("columna-izquierda");
      const escala = columna.clientWidth / ANCHO_DISENO_IZQ;
      columna.querySelectorAll(":scope > *").forEach(el => el.style.zoom = escala);
    }
    new ResizeObserver(escalarIzquierda).observe(document.getElementById("columna-izquierda"));

    // ====================================================== ESCALAR COLUMNA CENTRAL
    const ANCHO_DISENO_CENTRO = 750;
    function escalarCentro() {
      const columna = document.querySelector(".columna-central");
      const escala = columna.clientWidth / ANCHO_DISENO_CENTRO;
      columna.querySelectorAll(":scope > *").forEach(el => el.style.zoom = escala);
    }
    new ResizeObserver(escalarCentro).observe(document.querySelector(".columna-central"));

    // ====================================================== ESCALAR COLUMNA DERECHA
    const ANCHO_DISENO_DER = 500;
    function escalarDerecha() {
      const columna = document.getElementById("columna-derecha");
      const escala = columna.clientWidth / ANCHO_DISENO_DER;
      columna.querySelectorAll(":scope > *").forEach(el => el.style.zoom = escala);
    }
    new ResizeObserver(escalarDerecha).observe(document.getElementById("columna-derecha"));
  </script>
  
  <script src="i18n.js"></script>

  <!-- Firebase (la librería oficial, se carga desde internet) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- Archivos de juego -->
  <script src="cartas.js"></script>
  <script src="online.js"></script>
  <script src="lobby.js"></script>

</body>
</html>
