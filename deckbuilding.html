<!DOCTYPE html>  <!-- documento HTML5 -->
<html lang="es">
<head>
  <link rel="icon" type="image/png" href="favicon.png">                   <!-- icono navegador -->
  <meta charset="UTF-8">                                                  <!-- codificación de caracteres -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <!-- responsive básico -->
  <title>HVB-TCG · Deckbuilder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="base.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }          /* reset básico para todos los elementos */

    :root {                                       /* variables de color reutilizables, mismas que index.html y lobby.html */
      --surface: #16161a;                       /* superficie oscura de paneles */
      --surface2: #1e1e24;                      /* superficie secundaria (inputs, etc) */
      --surface3: #26262e;                      /* superficie terciaria, para detalles */
      --border: rgba(255,255,255,0.07);         /* borde muy sutil */
      --border2: rgba(255,255,255,0.13);        /* borde algo más marcado */
      --text: #e8e8ec;                          /* texto claro (para fondos oscuros) */
      --text2: #9090a0;                         /* texto gris apagado */
      --font-display: 'Anton', sans-serif;        /* fuente de títulos, la misma que el index */
      --cartas-por-fila: 8;                     /* número de cartas por fila en el catálogo */
    }
    body {
      background: var(--bg);           /* fondo general de la página */
      color: var(--tinta);             /* texto oscuro por defecto: el fondo de la página es claro */
      font-family: var(--font-texto);  /* fuente base, de base.css */
      font-size: 14px;                 /* tamaño de texto base */
      min-height: 100vh;               /* ocupa toda la altura de pantalla */
      overflow: hidden;                /* sin scroll en el body — cada columna scrollea por su cuenta */
    }

    /* -------------------------------------------------- CONTENEDOR TRÍPTICO ------------------------------------------ */
    .triptico {
      display: flex;         /* las 3 columnas en fila, una al lado de otra */
      width: 100%;           /* ocupa todo el ancho de la pantalla */
      height: 100vh;         /* ocupa toda la altura de la pantalla */
    }

    /* -------------------------------------------------- COLUMNAS ------------------------------------------ */
    #columna-izquierda {
      width: 20%;                                 /* siempre el 20% de la pantalla */
      flex-shrink: 0;                             /* no se encoge nunca, aunque falte espacio */
      background-image: url('img/fondos/deckb.jpg'); 
      background-color: #1a1a2e;                /* color de respaldo mientras no hay imagen */
      background-size: cover;                     /* la imagen cubre toda la columna sin deformarse */
      background-position: center;                /* centrada dentro de la columna */
      border-right: 3px solid var(--accent);      /* borde naranja hacia el centro, igual que en index/lobby */
      position: relative;                         /* necesario para poner el preview encima */
    }
    .columna-central {
      flex: 1;                     /* crece para ocupar TODO el espacio que sobra entre izquierda y derecha */
      display: flex;               /* por si luego apilamos filtros arriba y catálogo abajo */
      flex-direction: column;      /* apilado en vertical */
      overflow: hidden;            /* el scroll irá en el catálogo interior, no aquí */
      background: var(--bg);       /* mismo fondo gris clarito */
    }
    .columna-derecha {
      width: 22%;                   /* siempre el 22% de la pantalla */
      flex-shrink: 0;               /* no se encoge */
      background: var(--bg);        
      border-left: 3px solid var(--accent); /* borde naranja hacia el centro */
      display: flex;
      flex-direction: column;       /* apilado en vertical (cabecera del mazo, lista de cartas, etc.) */
      overflow: hidden;             /* scroll interno se pondrá más adelante en la lista de cartas */
    }

    /* -------------------------------------------------- CABECERA ------------------------------------------ */
    header {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 16px 28px;
      border-bottom: 2px solid var(--accent);       /* línea naranja, coherente con los bordes del tríptico */
      background: var(--bg);                       /* fondo negro, como los paneles de lobby.html */
      flex-shrink: 0;
    }
    header h1 {
      flex: 1;                                    /* ocupa el espacio entre "volver" y las pestañas */
      text-align: center;
      margin: 0;
      font-family: var(--font-display);           /* Anton, como el index */
      font-weight: 400;                           /* Anton solo tiene un grosor */
      font-size: 36px;
      letter-spacing: 3px;
      line-height: 1;
      color: var(--tinta);                        /* relleno negro */
      -webkit-text-stroke: 3px var(--accent);     /* contorno de tu color */
      paint-order: stroke fill;                   /* el contorno se pinta detrás del relleno */
    }
    .volver-link {
      text-decoration: none;
      color: var(--accent);
      font-weight: bold;
      font-size: 13px;
      white-space: nowrap;
    }
    nav {                 /* zona de navegación de pestañas con botones */
      display: flex;      /* pone las pestañas en fila, una al lado de otra */
      gap: 8px;           /* separación entre ellas */
      margin-left: auto;  /* las empuja hacia la derecha del header */
    }

    /* -------------------------------------------------- BOTONES ------------------------------------------ */
    .tab-btn {
      padding: 8px 18px;
      font-size: 13px;
    }
    .tab-btn.active {
      background: var(--accent);
      color: var(--tinta);
    }

    /* -------------------------------------------------- FILTROS ------------------------------------------ */
    .filters {
      padding: 14px 20px;               /* aire interior arriba/abajo y a los lados */
      background: var(--bg);              
      border-bottom: 2px solid var(--accent);    /* línea separadora con el catálogo que irá debajo */
      display: flex;                    /* todos los filtros en fila */
      flex-direction: column;
      flex-wrap: wrap;                  /* si la pantalla es estrecha, los filtros saltan a la línea siguiente en vez de desbordar */
      gap: 10px;                         /* separación entre cada filtro */
      flex-shrink: 0;                   /* esta barra nunca se encoge, aunque el catálogo de abajo necesite más espacio */
    }
    .filters-fila1 {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .filters-fila2,
    .filters-fila3 {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .separador {
      width: 4px;                 /* muy fina, como una línea */
      height: 24px;               /* altura similar a los botones/pills de al lado */
      background: var(--accent);  /* color naranja, para que combine con el resto */
      flex-shrink: 0;             /* nunca se encoge ni desaparece */
    }
    /* -------------------------------------- BUSCADOR DE TEXTO --------------------------------- */
    .search-wrap { /* buscador de texto como elemento en la cabecera */
      flex: 1;                /* el buscador "crece" para ocupar todo el espacio que sobra junto a los selects */
      min-width: 180px;      /* pero nunca se encoge por debajo de 180px, aunque falte sitio */
    }
    .search-wrap input {
      width: 100%;
      padding: 7px 10px;
      font-size: 13px;
    }

    /* -------------------------------------- LISTAS --------------------------------- */
    .filters select {
      padding: 7px 10px;
      font-size: 13px;
      cursor: pointer;
    }

    /* ------------------------------- BOTONES DE FILTRO PEQUEÑOS --------------------------------- */
    .filter-pills {
      display: flex;            /* las 3 pills (Personaje/Evento/Con habilidad) en fila */
      gap: 5px;                 /* separación pequeña entre ellas */
      flex-wrap: wrap;          /* saltan de línea si no caben */
    }
    .pill,
    .pill-reset {
      padding: 4px 12px;
      border: 1px solid var(--accent);
      background: var(--tinta);
      color: var(--accent);
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .pill-reset {
      padding: 4px 8px;
    }
    .pill:hover,
    .pill.on,
    .pill-reset:hover {
      background: var(--accent);
      color: var(--tinta);
    }

    /* ------------------------------- ESTILO CONTADOR Y GRID DE CARTAS --------------------------------- */
    .card-count {                         /* contador de cartas */
      font-size: 12px;
      color: #666;                      /* gris medio, discreto */
      padding: 8px 20px; 
      background: var(--bg);               
      /* border-bottom: 2px solid var(--accent);     separación con el grid de abajo */
      flex-shrink: 0;                     /* nunca se encoge */
    }
    .catalogue-grid {
      flex: 1;                          /* ocupa todo el espacio vertical que sobra */
      overflow-y: auto;                 /* scroll propio si hay muchas cartas */
      padding: 2px 20px;
      margin-right: 4px;
      display: grid;                    /* rejilla de miniaturas */
      grid-template-columns: repeat(var(--cartas-por-fila), minmax(0, 1fr));  /* siempre el número de cartas que elijas */
      gap: 12px;                        /* separación entre miniaturas */
      align-content: start;             /* las cartas se agrupan arriba, no se estiran para llenar el alto */
      grid-auto-rows: max-content;      /* cada fila mide lo que su carta necesita: si no caben, aparece el scroll */
    }

    /* ------------------------------- CARTAS EN MINIATURA --------------------------------- */
    .card-thumb { /* ------------------------------------- Caja de la carta */
      background: var(--tinta);
      border-radius: 0;                             /* esquinas rectas */
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s;
      position: relative;
      display: flex;
      flex-direction: column;
      user-select: none;
      /* el borde del color de la escuela lo pone el JS */
    }
    .card-thumb:hover { /* ------------------------------------- Ratón por encima */
      transform: translateY(-3px);
      box-shadow: 3px 3px 0 var(--color-escuela);   /* sombra dura del color de escuela */
    }
    .card-thumb.in-deck,
    .card-thumb.in-deck:hover { /* ------------------------------------- Carta ya en el mazo */
      box-shadow: 0 0 0 3px var(--accent);          /* halo de tu color, también al pasar el ratón */
    }
    .card-art { /* ------------------------------------- Contenedor de la carta */
      width: 100%;
      aspect-ratio: 5 / 7;          /* la proporción de una carta: el alto sigue al ancho */
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eee;           /* color de respaldo mientras la imagen carga o si falta */
      flex-shrink: 0;               /* la imagen nunca se encoge: siempre conserva su forma de carta */
    }
    .card-art img { /* ------------------------------------- Arte de la carta */
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card-esc-bar { /* ------------------------------------- Línea color escuela */
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 3px;
    }
    .card-info { /* ------------------------------------- Información de la carta */
      padding: 6px 8px;
      display: flex;
      align-items: center;              /* alinear nombre y posición en la misma línea */
      justify-content: space-between;
      gap: 6px;
    }

    .card-name { /* ------------------------------------- Nombre del personaje */
      font-size: 11px;
      color: var(--gris-medio);     /* gris claro sobre el negro de la tarjeta */
      font-weight: 400;             /* normal: es un dato secundario, no un título */
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;                         /* ocupa el espacio disponible */
    }
    .card-position {
      flex-shrink: 0;           /* nunca se encoge */
      color: var(--tinta-escuela);   /* negro o blanco según la escuela */
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 0px;
      line-height: 1.4;
    }

    .card-add-btn { /* ------------------------------------- Botón + para añadir al mazo */
      position: absolute;
      top: 6px; right: 6px;
      width: 24px; height: 24px;
      background: var(--color-escuela);       /* relleno del color de su escuela */
      border: 2px solid var(--tinta);         /* contorno negro: se separa de cualquier ilustración */
      border-radius: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      color: var(--tinta-escuela);            /* negro o blanco, según la escuela */
      transition: all 0.12s;
      z-index: 3;
    }
    .card-add-btn:hover {
      background: var(--tinta);               /* en hover se invierte: negro… */
      border-color: var(--color-escuela);     /* …con el borde… */
      color: var(--color-escuela);            /* …y el + del color de la escuela */
    }

    .card-count-badge { /* ------------------------------------- Copias de esta carta en el mazo */
      position: absolute;
      top: 6px; left: 6px;
      background: var(--color-escuela);
      border: 2px solid var(--tinta);
      color: var(--tinta-escuela);
      font-size: 11px;
      font-weight: 700;
      width: 22px; height: 22px;              /* 2px más que antes, para compensar el borde */
      border-radius: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
    }

    /* ----------------------------------------------------------------------------------------------------- */
    .preview-panel { /* --------------------------------------------------------- PANEL DE PREVIEW DE CARTAS */
      display: none;
      position: absolute;
      top: 50%;                /* margen desde arriba, para que no toque el borde */
      left: 10px;
      right: 10px;               /* margen a los lados, dentro de la columna de 260px */
      transform: translateY(-50%);
      flex-direction: column;
      background: var(--bg);
      border-radius: 0;
      overflow: visible;                       /* la etiqueta y el bocadillo podrán sobresalir */
      box-shadow: 5px 5px 0 var(--tinta);      /* sombra dura negra */
      z-index: 5;
    }
    .preview-panel.show {
      display: flex;
    }
    .preview-imagen {
      width: 100%;
      aspect-ratio: 5 / 7;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
    }

    /* bocadillo con la descripción: abajo a la derecha, sobresale un poco */
    .preview-bocadillo {
      display: none;
      position: absolute;
      right: 12px;                           /* más centrado, como la etiqueta */
      top: calc(100% - 40px);                /* posición de partida; la ajusta el JS al hacer clic */
      max-width: calc(100% - 24px);         /* 12px de margen a la derecha (el right) + 12px a la izquierda */
      padding: 12px 14px;
      background: var(--color-escuela);      /* colores de la etiqueta del nombre */
      color: var(--tinta-escuela);
      border: 3px solid var(--tinta);
      border-radius: 0;
      box-shadow: 3px 3px 0 var(--tinta);
      font-size: 14px;
      line-height: 1.5;
      z-index: 2;
    }

    /* cajas de habilidad dentro de la descripción ("Recepción", "Recepción perfecta (1)"…) */
    .preview-bocadillo span[style*="background"] {
      display: inline-block;          /* su borde y padding ocupan espacio: la línea crece y no se pisan */
      margin: 2px 1px;                /* un poco de aire alrededor de cada caja */
      line-height: 1.25;              /* la caja, más compacta que el texto que la rodea */
      vertical-align: middle;         /* centrada respecto a la línea */
    }

    .preview-panel.con-descripcion .preview-bocadillo {
      display: block;                        /* visible tras el clic */
    }
    .preview-panel.con-descripcion .preview-bocadillo:empty {
      display: none;                         /* cartas sin descripción: no sale un bocadillo vacío */
    }

    /* icono "i": indica que se puede hacer clic para ver la descripción */
    .preview-icono {
      position: absolute;
      left: -10px;                           /* sobresale un poco por la esquina inferior izquierda */
      bottom: -17px;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-escuela);
      color: var(--papel);                   /* el icono, en blanco */
      border: 3px solid var(--tinta);
      box-shadow: 2px 2px 0 var(--tinta);
      font-family: var(--font-titulos);
      font-weight: var(--peso-titulos);
      font-size: 14px;
      z-index: 2;
    }
    .preview-panel.con-descripcion .preview-icono,
    .preview-panel.sin-descripcion .preview-icono {
      display: none;                         /* oculto con el bocadillo abierto o si no hay descripción */
    }

    /* ---------------------------------------------- PREVIEW ETIQUETA NOMBRE TOOLTIP ------------------------- */
    /* etiqueta superpuesta en la esquina superior derecha: toque cómic */
    .preview-etiqueta {
      position: absolute;
      bottom: calc(100% - 8px);             /* solo sus últimos 18px se meten en la carta; el resto sobresale */
      right: 12px;                          /* …y por la derecha */
      max-width: calc(100% - 24px);         /* 12px de margen a la derecha (el right) + 12px a la izquierda */
      padding: 6px 10px;
      background: var(--color-escuela);
      color: var(--tinta-escuela);           /* negro o blanco, según la escuela */
      border: 3px solid var(--tinta);
      box-shadow: 3px 3px 0 var(--tinta);    /* sombra dura, a juego con el panel */
      /* transform: rotate(2deg);               ligeramente torcida, como un cartel pegado */
      z-index: 2;                            /* por encima de la ilustración */
    }
    .preview-nombre {
      font-family: var(--font-titulos);
      font-weight: var(--peso-titulos);
      font-size: 14px;
      line-height: 1.15;
      letter-spacing: var(--espaciado-titulos);
      text-transform: uppercase;
    }
    .preview-datos {
      font-size: 11px;
      margin-top: 2px;
    }

    /* ---------------------------------------------- BARRA DE SCROLL PERSONALIZADA ------------------------- */
    .catalogue-grid::-webkit-scrollbar {
      width: 10px;                    /* ancho de la barra */
    }
    .catalogue-grid::-webkit-scrollbar-track {
      background: var(--bg);          /* fondo del "carril" por donde se desliza */
    }
    .catalogue-grid::-webkit-scrollbar-thumb {
      background: var(--accent);      /* color de la barra */
      border-radius: 0px;             /* esquinas redondeadas */
    }
    .catalogue-grid::-webkit-scrollbar-thumb:hover {
      background: var(--tinta);         /* negro al pasar el ratón, sin borde */
    }

    /* ---------------------------------------------- COLUMNA DERECHA DECKBUILDER  ------------------------- */
    /* ---------------------------------------------- BARRA DE SCROLL PERSONALIZADA ------------------------- */
    .deck-header {                            /* Cabecera */
      padding: 14px 18px 10px;
      border-bottom: 3px solid var(--accent);
      flex-shrink: 0;
    }
    .deck-name-input {
      width: 100%;
      padding: 8px 10px;
      font-size: 14px;
      font-weight: 700;          /* el nombre del mazo, en negrita: es el título de lo que construyes */
      margin-bottom: 8px;
    }

    .deck-stats-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      font-size: 11px;
    }
    .deck-stat {                               /* contadores de cartas y eventos */
      padding: 3px 10px;
      border-radius: 0;                  /* esquinas rectas */
      background: var(--tinta);          /* negro, como botones y campos */
      color: var(--accent);
    }
    .deck-stat.warn { color: #ff6b6b; }
    .deck-stat.ok   { color: #6fcf73; }

    /* ----------------------------------------------------------- ACCIONES ---- */
    .deck-actions {                             /* botones guardar, exportar, .. */
      padding: 10px 18px;
      display: flex;
      gap: 6px;
      flex-shrink: 0;
      border-bottom: 3px solid var(--accent);
    }
    .btn-mini {
      flex: 1;
      padding: 7px 4px;
      font-size: 11px;
      text-align: center;
      white-space: nowrap;
      text-transform: uppercase;
    }
    /* --------------------------------------------------------- DECK LIST ---- */
    .deck-list {                                    /* deck list */
      flex: 1;
      overflow-y: auto;
      padding: 10px 0;
      border-bottom: 3px solid var(--accent);
      margin-right: 4px;
    }
    .deck-section-title {                           /* Personajes () */
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--text2);
      padding: 8px 18px 4px;
      text-transform: uppercase;
    }
    .deck-entry {                                   /* cada carta en la lista */
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 8px 6px 6px;
      margin: 4px 12px;
      background: var(--tinta);
      border-radius: 0;
      transition: transform 0.1s, box-shadow 0.1s;
      cursor: pointer;                              /* se puede hacer clic para ver la descripción */
      /* el borde y los colores de la escuela los pone el JS */
    }
    .deck-entry:hover {
      transform: translateY(-2px);
      box-shadow: 3px 3px 0 var(--color-escuela);   /* sombra dura de su escuela, como en el catálogo */
    }
    .deck-entry-thumb {                             /* miniatura de la imagen */
      width: 32px;
      height: 32px;
      border-radius: 0;
      flex-shrink: 0;
      background-size: 150%;                        /* zoom sobre la ilustración */
      background-position: center 20%;              /* un poco hacia arriba para enfocar la cara */
      background-repeat: no-repeat;
    }
    .deck-entry-color {                             /* barra de color de escuela */
      width: 4px;
      height: 32px;
      border-radius: 0;
      flex-shrink: 0;
    }
    .deck-entry-name {                              /* nombre carta */
      flex: 1;
      overflow: hidden;
      font-size: 12px;
      color: var(--text);
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .deck-entry-qty {                               /* cantidad */
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      min-width: 16px;
      text-align: center;
    }
    .deck-entry-rm {                                /* botones − y ✕ */
      width: 20px;
      height: 20px;
      border: 1px solid var(--gris-medio);
      border-radius: 0;
      background: transparent;
      color: var(--gris-medio);
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.12s;
      flex-shrink: 0;
    }
    .deck-entry-rm:hover {
      background: var(--color-escuela);             /* se rellena del color de la escuela */
      border-color: var(--color-escuela);
      color: var(--tinta-escuela);
    }
    .deck-empty {                                   /* mazo vacío */
      padding: 40px 20px;
      text-align: center;
      color: var(--text2);
      font-size: 12px;
    }

    /* -------------------- BARRA DE SCROLL PERSONALIZADA (deck-list) ------------------------- */
    .deck-list::-webkit-scrollbar {
      width: 10px;
    }
    .deck-list::-webkit-scrollbar-track {
      background: var(--bg);
    }
    .deck-list::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 0px;
    }
    .deck-list::-webkit-scrollbar-thumb:hover {
      background: var(--tinta);
    }
    /* ----------------------------------------------------------- MAZOS GUARDADOS ---- */
    .saved-decks-bar {
      border-top: 1px solid var(--border2);
      padding: 10px 18px 12px;
      max-height: 180px;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .saved-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--text2);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .select-oscuro {
      padding: 7px 10px;
      font-size: 13px;

      display: grid;

      grid-auto-columns: minmax(0, 1fr);       /* y todos se reparten el ancho a partes iguales */

    }

    .pre-deck-card {
      background: #000000;

      border-radius: 0;

      background: var(--tinta);                 /* en hover se invierte a negro… */

    .pre-deck-banner {

      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pre-deck-body {
      flex: 1;                                 /* ocupa el resto de la tarjeta */

      flex-direction: column;
      padding: 12px 14px 18px;                 /* más aire abajo para el botón */

    .pre-deck-name {
      font-weight: 700;
      font-size: 15px;
      color: var(--text);

    .pre-deck-desc {

      color: var(--text2);

    .pre-deck-tags {

      gap: 5px;
      flex-wrap: wrap;

      font-size: 10px;
      font-weight: 700;

  <script>
    // -------------------------------------------------- APLICAR COLOR AL GUARDADO DE PÁGINA ------------------------------------------ 
    // recupera el color de acento que el usuario eligió en Settings (index.html)
    const colorGuardado = localStorage.getItem("hv-accent");
    if (colorGuardado) {                                                        // si hay un color guardado de una sesión anterior
      document.documentElement.style.setProperty("--accent", colorGuardado);    // lo aplica a la variable CSS --accent
    }

    // ---------------------------------------------- CAMBIAR DE PESTAÑA ------------------------------------------- 
    function setTab(tab) {
      document.getElementById("tab-builder").classList.toggle("active", tab === "builder");
      document.getElementById("tab-predefined").classList.toggle("active", tab === "predefined");
      document.getElementById("vista-constructor").style.display = tab === "builder" ? "flex" : "none";
      document.getElementById("vista-predefinidos").style.display = tab === "predefined" ? "flex" : "none";
      if (tab === "predefined") renderPredefined();
    }

    // ---------------------------------------------- CARTAS ------------------------------------------- 
    const CATALOGUE = inicializarCartas();          // carga todas las cartas desde cartas.js
    const imgPath = id => `img/cartas/${id}.png`;   // ruta de la imagen de cada carta
    const esNoProgramada = c => c.id.startsWith("HV-P03-"); // cartas no programadas por el momento
    function getCardName(c) {                       // nombre de la carta en el idioma activo
      return DESCRIPCIONES?.[c.id]?.["nombre_" + idiomaActivo] || c.nombre;
    }

    // ------------------------------------- RENDER DEL GRID (sin filtros todavía, solo mostrar todo) 
    function renderCatalogo(lista) {
      document.getElementById("cardCount").textContent = t("deckbuilder.contadorCartas", { cantidad: lista.length });
      const grid = document.getElementById("catalogueGrid");
      grid.innerHTML = "";
      lista.forEach(c => grid.appendChild(buildCardThumb(c)));
      deck.forEach(e => refreshThumbBadge(e.carta.id));   // volver a pintar copias y halo en las cartas visibles
    }

    // ------------------------------------- COLORES ESCUELAS
    function getSchoolColor(escuela) {
      const colores = {
        Karasuno:        '#E8761A',
        Nekoma:          '#C62828',
        Fukurodani:      '#D4AF37',
        Shiratorizawa:   '#6A1B9A',
        Inarizaki:       '#5C0A1E',
        Kamomedai:       '#4a9ee6',
        Itachiyama:      '#93C572',
        'Wakutani Minami': '#E91E8C',
        'Date Kôgyô':    '#0F5C3D',
        'Aoba Jôsai':      '#1AA6A0',
        Tokonami:         '#4A7FA5',
        Ohgiminami:         '#2C3E70',
        Kakugawa:         '#7CB342',
        'Sarukawa Kôgyô':         '#2E3A6E',
        Tsubakihara:         '#C9A63C',
        Nohebi:          '#006F68',
        'Niiyama Joshi': '#E63950',
        'Kitagawa Daiichi': '#2B5DB0',
        'Asas São Paulo': '#E0471B',
        'Ifviga Torino': '#2E9E5B',
      };
      return colores[escuela] || '#999999';   // gris por defecto si no coincide ninguna
    }

    // ------------------------------------- TEXTO NEGRO O BLANCO SEGÚN EL COLOR DE FONDO
    function tintaSobre(hex) {
      const r = parseInt(hex.slice(1, 3), 16);      // rojo   (0-255)
      const g = parseInt(hex.slice(3, 5), 16);      // verde  (0-255)
      const b = parseInt(hex.slice(5, 7), 16);      // azul   (0-255)
      const luminosidad = 0.299 * r + 0.587 * g + 0.114 * b;   // cuánto "brilla" el color para el ojo
      return luminosidad > 150 ? "#000000" : "#FFFFFF";         // fondo claro → texto negro; oscuro → blanco
    }

    // ------------------------------------- CONSTRUIR MINIATURA DE CARTA
    function buildCardThumb(c) {
      const div = document.createElement("div");
      div.className = "card-thumb";
      div.dataset.id = c.id;

      const nombre = getCardName(c);
      const colorEscuela = getSchoolColor(c.escuela);  // color escuela
      div.style.border = `2px solid ${colorEscuela}`;
      div.style.setProperty("--color-escuela", colorEscuela);   // el CSS puede usar el color de la escuela de esta carta
      div.style.setProperty("--tinta-escuela", tintaSobre(colorEscuela));   // negro o blanco, lo que se lea mejor

      div.innerHTML = `
        <div class="card-art">
          <img src="${imgPath(c.id)}" alt="${nombre}" loading="lazy" onerror="this.style.display='none'">
          <div class="card-esc-bar" style="background:${colorEscuela}"></div>
        </div>
        <button class="card-add-btn" title="Añadir al deck">+</button>
        <div class="card-info" data-nombre="${nombre}">
          <div class="card-name">${c.id.replace(/^HV-/, "")}</div>
          ${c.rareza ? `<span class="card-position" style="background:${colorEscuela}">${c.rareza}</span>` : ''}
        </div>`;
      
      div.querySelector('.card-add-btn').addEventListener('click', e => {
        e.stopPropagation();   // evita que el clic dispare también el hover/mouseleave raro
        addToDeck(c);
      });

      // clic en la carta (no en el +): mostrar u ocultar la descripción en el preview
      div.addEventListener("click", alternarDescripcion); 

      // ------------------------------------------------------------------- Mostrar tooltip al pasar el ratón   
      div.addEventListener("mouseenter", () => mostrarPreview(c));
      div.addEventListener("mouseleave", () => ocultarPreview());

      return div;
    }

    // ------------------------------------- MOSTRAR TOOLTIP
    function mostrarPreview(c) {
      const panel   = document.getElementById("previewPanel");
      const imagen  = document.getElementById("previewImagen"); 
      const nombre = getCardName(c);
      const colorEscuela = getSchoolColor(c.escuela);

      imagen.style.backgroundImage = `url('${imgPath(c.id)}')`;   // imagen de fondo
      panel.style.border = `3px solid ${colorEscuela}`;           // borde del color de la escuela

      // colores de la escuela, para que el CSS los use en la etiqueta (y luego en el bocadillo)
      panel.style.setProperty("--color-escuela", colorEscuela);
      panel.style.setProperty("--tinta-escuela", tintaSobre(colorEscuela));

      // etiqueta: nombre arriba; escuela, posición y código debajo
      const datos = [
        c.escuela || (c.tipo === "evento" ? t("deckbuilder.pillEvento") : ""),
        c.posicion,
        c.id
      ].filter(Boolean).join(" · ");                  // quita los huecos vacíos (p. ej. eventos sin posición)

      document.getElementById("previewEtiqueta").innerHTML = `
        <div class="preview-nombre">${nombre}</div>
        <div class="preview-datos">${datos}</div>`;

      const descripcion = DESCRIPCIONES?.[c.id]?.[idiomaActivo] || c.descripcion || "";

      // bocadillo con la descripción (oculto hasta que se hace clic en la carta)
      document.getElementById("previewBocadillo").innerHTML = descripcion.replace(/&quot;/g, '"');
      panel.classList.toggle("sin-descripcion", !descripcion.trim());   // sin texto: no se muestra el icono
      panel.classList.remove("con-descripcion");      // cada carta nueva empieza sin bocadillo

      panel.classList.add("show");
    }

    // ------------------------------------- OCULTAR TOOLTIP
    function ocultarPreview() {
      document.getElementById("previewPanel").classList.remove("show");
    }
    // ------------------------------------- COLOCAR EL BOCADILLO: lo más abajo posible sin salirse de la pantalla
    function colocarBocadillo() {
      const panel     = document.getElementById("previewPanel");
      const bocadillo = document.getElementById("previewBocadillo");
      const escala    = parseFloat(panel.style.zoom) || 1;           // zoom actual del panel
      const rect      = panel.getBoundingClientRect();               // posición del panel en la pantalla
      const SOLAPE = 40 * escala;                                    // cuánto se mete en la carta (también escalado)
      const MARGEN = 12;                                             // separación mínima con el borde de la pantalla

      let top = rect.bottom - SOLAPE;                                // posición ideal, en píxeles de pantalla
      const alto = bocadillo.getBoundingClientRect().height;         // altura real en pantalla
      if (top + alto > window.innerHeight - MARGEN) {                // si se saldría por abajo…
        top = window.innerHeight - MARGEN - alto;                    // …se sube lo justo
      }
      // pasar de píxeles de pantalla a píxeles dentro del panel (que está escalado)
      bocadillo.style.top = ((top - rect.top) / escala - panel.clientTop) + "px";
    }
    // ------------------------------------- MOSTRAR / OCULTAR LA DESCRIPCIÓN (catálogo y lista del mazo)
    function alternarDescripcion() {
      const panel = document.getElementById("previewPanel");
      panel.classList.toggle("con-descripcion");
      if (panel.classList.contains("con-descripcion")) colocarBocadillo();
    }

    // ----------------------------------------------------------------------------------------- FILTROS //
        // ------------------------------------- RELLENAR LISTA ESCUELAS
    function llenarListaEscuela() {
      const escuelas = [...new Set(CATALOGUE.map(c => c.escuela).filter(Boolean))].sort();  // escuelas únicas, sin vacíos, ordenadas
        // CATALOGUE.map(c => c.escuela) → saca un array con la escuela de CADA carta (con repetidos)
        // .filter(Boolean) → quita los valores vacíos/null/undefined (p.ej. cartas sin escuela, como algunos eventos)
        // new Set(...) → convierte el array en un "conjunto" que elimina automáticamente los duplicados
        // [...] → vuelve a convertirlo en un array normal para poder usar .sort()
        // .sort() → ordena alfabéticamente

      const select = document.getElementById("filterEscuela");      // crear la lista HTML
      escuelas.forEach(e => {                                       // por cada opción
        const option = document.createElement("option");            // crea el valor
        option.value = e;                                           // valor interno para el filtro
        option.textContent = e;                                     // valor asociado al texto
        select.appendChild(option);
      });
    }
    // ------------------------------------- ESTADO FILTROS
    let activeFilters = { tipo: null, mazo: null };                  // pills: tipo ("personaje"/"evento") y "solo mi mazo"
    // ------------------------------------- APLICAR FILTROS
    function applyFilters() {                                        // leer todos los filtros
      const q        = document.getElementById("searchInput").value.toLowerCase().trim();
      const escuela  = document.getElementById("filterEscuela").value;
      const posicion = document.getElementById("filterPosicion").value;
      const rareza   = document.getElementById("filterRareza").value;

      // no mostrar nada, si no hay filtro
      const hayFiltro = q || escuela || posicion || rareza || 
          activeFilters.tipo || (statFiltro.stat && statFiltro.valores.size > 0 || 
          filtroExpansiones.size > 0 || filtroFases.size > 0 || activeFilters.mazo);
        if (!hayFiltro) {
          document.getElementById("cardCount").textContent = t("deckbuilder.aplicaFiltro") || "Aplica al menos un filtro para ver cartas";
          document.getElementById("catalogueGrid").innerHTML = "";
          return;
        }

      const resultado = CATALOGUE.filter(c => {                        // mostrar o no según se encuentre en el filtro
        if (c.oculta) return false;                                             // excluir cartas ocultas del catálogo
        if (q) {                                                                // filtro por texto escrito
          const nombreTraducido = getCardName(c).toLowerCase();   
          const coincideNombre  = c.nombre.toLowerCase().includes(q) || nombreTraducido.includes(q); // ← comprueba ambos
          const coincideId      = (c.id || '').toLowerCase().includes(q);
          if (!coincideNombre && !coincideId) return false;
        }
        if (escuela && c.escuela !== escuela && !c.escuelasDoble?.includes(escuela)) return false;
        if (posicion && c.posicion !== posicion) return false;
        if (rareza   && c.rareza   !== rareza)   return false;
        if (filtroExpansiones.size > 0 && !filtroExpansiones.has(expansionDe(c))) return false;  // filtro por expansión
        if (filtroFases.size > 0 && ![...fasesDe(c)].some(f => filtroFases.has(f))) return false;  // filtro por fase
        if (activeFilters.mazo && getDeckQty(c.id) === 0) return false;  // solo cartas que ya están en el mazo
        if (activeFilters.tipo && c.tipo !== activeFilters.tipo) return false;  // filtro personaje/evento

        // ------------------------ FILTRO POR ESTADÍSTICAS
        if (statFiltro.stat && statFiltro.valores.size > 0) {
          const valorCarta = c.stats?.[statFiltro.stat];              // valor de esa stat en esta carta
          if (!statFiltro.valores.has(valorCarta)) return false;      // si no está entre los valores marcados, descartar
        }

        return true;
      });
      renderCatalogo(resultado);                                                // repintar el catálogo
    }
    // ------------------------------------- TOOGLES DE PILLS DE FILTROS
    function togglePill(el) {
      const filtro = el.dataset.filter;                         // lee el atributo del pill tipo
      const valor  = el.dataset.val;                            // lee el atributo del pill 
      const estabaActiva = el.classList.contains("on");

      // desactivar visualmente todas las pills del mismo grupo de filtro
      document.querySelectorAll(`.pill[data-filter="${filtro}"]`).forEach(p => p.classList.remove("on"));

      activeFilters[filtro] = estabaActiva ? null : valor;      // si ya estaba activa, se desactiva; si no, se activa
      if (!estabaActiva) el.classList.add("on");

      applyFilters();
    }
    // ------------------------------------- RESETEAR FILTROS
    function resetFiltros() {
      document.getElementById("searchInput").value = "";
      document.getElementById("filterEscuela").value = "";
      document.getElementById("filterPosicion").value = "";
      document.getElementById("filterRareza").value = "";
      document.getElementById("filterStat").value = "";
      activeFilters = { tipo: null, mazo: null };
      statFiltro = { stat: "", valores: new Set() };
      filtroExpansiones.clear();
      renderExpansionPills();
      filtroFases.clear();
      renderFasePills();
      document.querySelectorAll(".pill.on").forEach(p => p.classList.remove("on"));
      applyFilters();
    }

    // ------------------------------------- FILTRO POR EXPANSIÓN (selección múltiple)
    let filtroExpansiones = new Set();                               // expansiones marcadas
    const expansionDe = c => (c.id || "").split("-")[1] || "";       // "HV-P01-023" → "P01"

    // crear una pastilla por cada expansión que exista en el catálogo
    function renderExpansionPills() {
      const contenedor = document.getElementById("expansionPills");
      contenedor.innerHTML = "";
      const expansiones = [...new Set(CATALOGUE.map(expansionDe).filter(Boolean))].sort();

      expansiones.forEach(exp => {
        const pill = document.createElement("span");
        pill.className = "pill" + (filtroExpansiones.has(exp) ? " on" : "");
        pill.textContent = exp;
        pill.addEventListener("click", () => toggleExpansion(exp));
        contenedor.appendChild(pill);
      });
    }

    // marcar o desmarcar una expansión
    function toggleExpansion(exp) {
      if (filtroExpansiones.has(exp)) {
        filtroExpansiones.delete(exp);          // ya estaba marcada < la quito
      } else {
        filtroExpansiones.add(exp);             // no estaba > la añado
      }
      renderExpansionPills();
      applyFilters();
    }

    // ------------------------------------- FILTRO POR FASE DE LA HABILIDAD (selección múltiple)
    const FASES = ["saque", "recepcion", "pase", "remate", "bloqueo"];   // mismos nombres que en cartas.js
    let filtroFases = new Set();                                         // fases marcadas
    
    // texto de la caja de cada fase en las descripciones en español
    const ETIQUETA_FASE = {
      saque:     "Saque",
      recepcion: "Recepción",
      pase:      "Pase",
      remate:    "Ataque",
      bloqueo:   "Bloqueo",
    };

    // fases de una carta: las de la primera línea de su descripción + las de su campo "fases"
    function fasesDe(c) {
      const desc = DESCRIPCIONES?.[c.id]?.es || "";                       // siempre en español: las etiquetas son fijas
      const primeraLinea = desc.split(/<\/?br\s*\/?>/i)[0]                 // hasta el primer salto de línea
                               .replace(/<[^>]+>/g, " ");                  // quitar las etiquetas HTML, dejar solo el texto
      const encontradas = FASES.filter(f => primeraLinea.includes(ETIQUETA_FASE[f]));
      return new Set([...encontradas, ...(c.fases || [])]);              // juntar las dos fuentes, sin repetidos
    }

    function renderFasePills() {
      const contenedor = document.getElementById("fasePills");
      contenedor.innerHTML = "";

      FASES.forEach(fase => {
        const pill = document.createElement("span");
        pill.className = "pill" + (filtroFases.has(fase) ? " on" : "");
        // texto traducido: "saque" → t("deckbuilder.statSaque")
        pill.textContent = t("deckbuilder.stat" + fase.charAt(0).toUpperCase() + fase.slice(1));
        pill.addEventListener("click", () => toggleFase(fase));
        contenedor.appendChild(pill);
      });
    }

    function toggleFase(fase) {
      const estabaMarcada = filtroFases.has(fase);
      filtroFases.clear();                       // desmarcar todas…
      if (!estabaMarcada) filtroFases.add(fase); // …y marcar la pulsada (salvo que ya lo estuviera: entonces queda ninguna)
      renderFasePills();
      applyFilters();
    }

    // ------------------------------------- FILTRO POR ESTADÍSTICA
    let statFiltro = { stat: "", valores: new Set() };   // stat elegido + valores marcados

    // ------------------------------------- RELLENAR PILLS DE VALORES
    function renderStatValuePills() {
      const contenedor = document.getElementById("statValuePills");
      contenedor.innerHTML = "";

      if (!statFiltro.stat) return; // si no hay stat seleccionada, no mostrar nada

      for (let v = 0; v <= 6; v++) {
        const pill = document.createElement("span");
        pill.className = "pill" + (statFiltro.valores.has(v) ? " on" : "");
        pill.textContent = v;
        pill.addEventListener("click", () => toggleStatValue(v));
        contenedor.appendChild(pill);
      }
    }
    // // ------------------------------------- AL CAMBIAR DE ESTADÍSTICA
    document.getElementById("filterStat").addEventListener("change", function() {
      statFiltro.stat = this.value;
      statFiltro.valores.clear();   // al cambiar de stat, se resetean los valores marcados
      renderStatValuePills();
      applyFilters();
    });
    // ------------------------------------- PILLS DE UN VALOR CONCRETO
    function toggleStatValue(v) {
      if (statFiltro.valores.has(v)) {
        statFiltro.valores.delete(v);   // ya estaba marcado → lo quitamos
      } else {
        statFiltro.valores.add(v);      // no estaba → lo añadimos
      }
      renderStatValuePills();
      applyFilters();
    }

    // ------------------------------------- VINCULAR BOTONES CON FUNCIONES DE FILTRO
    document.getElementById("searchInput").addEventListener("input", applyFilters);
    document.getElementById("filterEscuela").addEventListener("change", applyFilters);
    document.getElementById("filterPosicion").addEventListener("change", applyFilters);
    document.getElementById("filterRareza").addEventListener("change", applyFilters);
    document.querySelectorAll(".pill").forEach(p => p.addEventListener("click", () => togglePill(p)));
    document.querySelector(".pill-reset").addEventListener("click", resetFiltros);
 
    
    // -------------------------------------------------------------- COLUMNA DERECHA
    // -------------------------------------------------------------- CREACIÓN DE DECKS
    let deck = [];                                                            
    let savedDecks = JSON.parse(localStorage.getItem('hv-decks') || '[]');    // mazos guardados con anterioridad
    let currentDeckId = null;                                                 // si el mazo ya fue guardado antes, aquí se guarda su ID

    // -------------------------------------------------------------- AÑADIR AL MAZO
    function addToDeck(c) {
      const total   = deck.reduce((s,e) => s+e.qty, 0);               // total de cartas del mazo
      const eventos = deck.filter(e => e.carta.tipo === 'evento').reduce((s,e) => s+e.qty, 0);  // total de eventos
      const entry = deck.find(e => e.carta.id === c.id);              // busca si la carta ya está en el mazo
      if (entry) entry.qty++; else deck.push({ carta: c, qty: 1 });   // añade +1, si es el caso
      refreshThumbBadge(c.id);                                        // actualiza el contador en el catálogo
      renderDeckList();                                               
    }
    // -------------------------------------------------------------- QUITAR DEL MAZO
    function removeFromDeck(id, all=false) {
      const idx = deck.findIndex(e => e.carta.id === id);             // buscar posición en el array
      if (idx === -1) return; 
      if (all || deck[idx].qty <= 1) deck.splice(idx, 1); else deck[idx].qty--; // si queda más de 1, restar 1, si queda 1, borrar por completo
      refreshThumbBadge(id);                                          // actualiza el contador en el catálogo
      renderDeckList();
    }
    // -------------------------------------------------------------- SUMAR UNA COPIA DESDE LA LISTA
    function sumarCopia(id) {
      const entry = deck.find(e => e.carta.id === id);   // la carta ya está en el mazo: la busco
      if (entry) addToDeck(entry.carta);                 // y uso la misma función que el + del catálogo
    }
    // -------------------------------------------------------------- VACIAR MAZO MAZO
    function clearDeck() {
      if (!deck.length) return;
      deck = []; currentDeckId = null;
      document.getElementById('deckNameInput').value = t("deckbuilder.nombreMazoDefecto");
      document.querySelectorAll('.card-count-badge').forEach(b => b.remove());
      document.querySelectorAll('.card-thumb.in-deck').forEach(el => el.classList.remove('in-deck'));
      renderDeckList();
    }

    // -------------------------------------------------------------- ACTUALIZAR CANTIDAD EN LA MINIATURA DEL CATÁLOGO
    function getDeckQty(id) {
      return deck.find(e => e.carta.id === id)?.qty || 0;             // busca la carta por ID y devuelve su cantidad
    }

    function refreshThumbBadge(id) {
      const el = document.querySelector(`.card-thumb[data-id="${id}"]`);  // busca la maniatura en el catálogo (por ID)
      if (!el) return;

      const qty = getDeckQty(id);
      el.classList.toggle('in-deck', qty > 0);                        // añade el borde más grueso (no estoy seguro de que funcione)

      let badge = el.querySelector('.card-count-badge');              // si ya existe el contador de la miniatura
      if (qty > 0) {
        if (!badge) {                                                 // si no existe, se crea
          badge = document.createElement('div');
          badge.className = 'card-count-badge';
          el.querySelector('.card-art').after(badge);                 // colocarlo después de la imagen
        }
        badge.textContent = qty;                                      // actualiza el número mostrado
      } else {
        badge?.remove();                                              // si no hay copias, borra el badge
      }
    }

    // -------------------------------------------------------------- RENDER DECK LIST
    function renderDeckList() {
      const list    = document.getElementById('deckList');              // contadores
      const total   = deck.reduce((s,e) => s+e.qty, 0);
      const eventos = deck.filter(e => e.carta.tipo === 'evento').reduce((s,e) => s+e.qty, 0);
      const escuelas = new Set(deck.filter(e => e.carta.tipo === 'personaje').map(e => e.carta.escuela));

      const st = document.getElementById('statTotal');                  // 0/40
      st.textContent = `${total} / 40`;                                 // contador de cartas
      st.className   = 'deck-stat' + (total === 40 ? ' ok' : total > 40 ? ' warn' : '');  // rojo o verde si mala/buena cantidad
      const se = document.getElementById('statEventos');                // 0/8
      se.textContent = `${eventos} ${t("deckbuilder.statEventos")}`;    // contador de eventos
      se.className   = 'deck-stat' + (eventos > 8 ? ' warn' : '');
      document.getElementById('statEscuelas').textContent = `${escuelas.size} ${t("deckbuilder.statEscuelas")}`;  // rojo o verde con eventos

      if (activeFilters.mazo) applyFilters();   // con "solo mi mazo" activo, repintar el catálogo
      if (!deck.length) {                                               // si el mazo está vacío
        list.innerHTML = `<div class="deck-empty"><div>${t("deckbuilder.deckVacioTexto")}</div></div>`;
        return;
      }

      //                                                                // separar personajes de eventos
      const personajes = deck.filter(e => e.carta.tipo === 'personaje')
        .sort((a,b) => (a.carta.escuela||'').localeCompare(b.carta.escuela||'') || a.carta.nombre.localeCompare(b.carta.nombre));
      const evts = deck.filter(e => e.carta.tipo === 'evento');

      const entryHTML = ({carta,qty}) => {                              // función para crear 1 fila en la lista
        const nombre = getCardName(carta);
        const color = getSchoolColor(carta.escuela);                    // color de la escuela
        const colorBorde = carta.tipo === 'evento' ? '#999' : color;
        return `
        <div class="deck-entry" data-id="${carta.id}" style="border: 2px solid ${colorBorde}; --color-escuela: ${colorBorde}; --tinta-escuela: ${tintaSobre(colorBorde)};">
          <div class="deck-entry-thumb" style="background-image:url('${imgPath(carta.id)}')"></div>
          <div class="deck-entry-color" style="background:${colorBorde}"></div>
          <div class="deck-entry-name" title="${nombre}">${nombre}</div>
          <button class="deck-entry-rm" onclick="removeFromDeck('${carta.id}')" title="${t('deckbuilder.quitarUna')}">−</button>
          <div class="deck-entry-qty">${qty}</div>
          <button class="deck-entry-rm" onclick="sumarCopia('${carta.id}')" title="${t('deckbuilder.anadirUna')}">+</button>
          <button class="deck-entry-rm" onclick="removeFromDeck('${carta.id}',true)" title="${t('deckbuilder.quitarTodas')}">✕</button>
        </div>`;
      };

      //                                                                 // creación del HTML final 
      let html = '';
      if (personajes.length) { html += `<div class="deck-section-title">${t("deckbuilder.seccionPersonajes")} (${personajes.reduce((s,e)=>s+e.qty,0)})</div>`; html += personajes.map(entryHTML).join(''); }
      if (evts.length)       { html += `<div class="deck-section-title">${t("deckbuilder.seccionEventos")} (${evts.reduce((s,e)=>s+e.qty,0)})</div>`;          html += evts.map(entryHTML).join(''); }
      list.innerHTML = html;

      //                                                                  // mostrar el tooltip
      list.querySelectorAll('.deck-entry').forEach(el => {
        const id = el.dataset.id;
        const entry = deck.find(e => e.carta.id === id);
        if (!entry) return;
        el.addEventListener('mouseenter', () => mostrarPreview(entry.carta));
        el.addEventListener('mouseleave', () => ocultarPreview());
        el.addEventListener('click', e => {
          if (e.target.closest('.deck-entry-rm')) return;   // los botones − y ✕ no abren el bocadillo
          alternarDescripcion();
        });
      });
      if (activeFilters.mazo) applyFilters();   // con "solo mi mazo" activo, repintar el catálogo
    }

    // -------------------------------------------------------------- BOTONES DE LA DECK LIST
    // -------------------------------------------------------------- GUARDAR MAZO
    function saveDeck() {
      const nombre = document.getElementById('deckNameInput').value.trim() || t("deckbuilder.nombreMazoDefecto");
      if (!deck.length) return;

      // Cartas bloqueadas P03
      if (deck.some(e => esNoProgramada(e.carta))) {
        alert(t("deckbuilder.errorP03"));
        return;
      }

      //                                                                  // validaciones antes de guardar
      const total   = deck.reduce((s,e) => s+e.qty, 0);
      const eventos = deck.filter(e => e.carta.tipo === 'evento').reduce((s,e) => s+e.qty, 0);
      if (total !== 40) {
        alert(t("deckbuilder.errorTotalCartas", { total }));
        return;
      }
      if (eventos > 8) {
        alert(t("deckbuilder.errorMaxEventos", { eventos }));
        return;
      }

      const data = {
        id: currentDeckId || Date.now().toString(),                         // reutilizar el id, si existe
        nombre,
        total: deck.reduce((s,e)=>s+e.qty,0),
        entries: deck.map(e => ({ id: e.carta.id, qty: e.qty })),           // guardar solo el id y la cantidad de cada carta
        fecha: new Date().toLocaleDateString('es-ES')
      };
      currentDeckId = data.id;                                              // recordar el id para futuros guardados del mismo mazo

      const idx = savedDecks.findIndex(d => d.id === data.id);
      if (idx !== -1) savedDecks[idx] = data; else savedDecks.push(data);   // sobreescribir el mazo, si ya existía, si no, añade como nuevo
      localStorage.setItem('hv-decks', JSON.stringify(savedDecks));         // guardar el array en el navegador 
      renderSavedDecks();
    }

    // -------------------------------------------------------------- CARGAR MAZO GUARDADO
    function loadSavedDeck(id) {
      if (!id) return;                                    // si el usuario seleccionó la opción vacía, no hacer nada

      const saved = savedDecks.find(d => d.id === id);    // busca el mazo guardado que coincide con ese id
      if (!saved) return;                                 // si no lo encuentra, no continúa

      deck = [];
      // reconstruye el array "deck" a partir de los datos guardados (solo id+qty),
      // buscando cada carta completa en el catálogo real
      saved.entries.forEach(e => { const c = CATALOGUE.find(x => x.id === e.id); if (c) deck.push({ carta: c, qty: e.qty }); });

      currentDeckId = saved.id;
      document.getElementById('deckNameInput').value = saved.nombre;    // rellena el input de nombre

      // limpia visualmente el catálogo (badges y bordes "in-deck") antes de repintar los correctos
      document.querySelectorAll('.card-count-badge').forEach(b => b.remove());
      document.querySelectorAll('.card-thumb.in-deck').forEach(el => el.classList.remove('in-deck'));
      deck.forEach(e => refreshThumbBadge(e.carta.id));                 // vuelve a pintar los badges
      renderDeckList(); 
      renderSavedDecks();
    }
    // -------------------------------------------------------------- BORRAR MAZO GUARDADO
    function deleteSelectedDeck() {
      const select = document.getElementById('savedDecksSelect');
      const id = select.value;                                       // lee qué mazo está seleccionado ahora mismo en el desplegable
      if (!id) return;

      const deckAEliminar = savedDecks.find(d => d.id === id);   // buscar el mazo para mostrar su nombre en la confirmación
      const confirmado = confirm(t("deckbuilder.confirmarEliminar", { nombre: deckAEliminar?.nombre || '' }));
      if (!confirmado) return;                                   // si el usuario pulsa "Cancelar", no borramos nada

      savedDecks = savedDecks.filter(d => d.id !== id);              // crea un nuevo array SIN el mazo eliminado
      localStorage.setItem('hv-decks', JSON.stringify(savedDecks));  // persiste el cambio en el navegador
      if (currentDeckId === id) clearDeck();                         // si el mazo eliminado era el que estaba cargado, vacía todo
      renderSavedDecks();
    }
    // -------------------------------------------------------------- RENDER MAZOS GUARDADOS
    function renderSavedDecks() {
      const select = document.getElementById('savedDecksSelect');         // recupera el <select> del HTML

      if (!savedDecks.length) {
        select.innerHTML = `<option value="">${t("deckbuilder.sinDecksGuardados")}</option>`;
        return;
      }

      select.innerHTML = savedDecks.map(d =>
        `<option value="${d.id}" ${d.id === currentDeckId ? 'selected' : ''}>${d.nombre} (${d.total}/40)</option>`
      ).join('');             // .map() genera un array de strings HTML; .join('') los pega todos en un único string
    }

    // ----------------------------------------------------------------------------------- IMPORTAR / EXPORTAR
    // -------------------------------------------------------------- EXPORTAR MAZO A JSON
    function exportDeck() {
      const nombre = document.getElementById('deckNameInput').value.trim() || 'Mi deck';
      if (!deck.length) return;
      const data = {
        nombre,
        version: '1.0',
        fecha: new Date().toISOString(),
        entries: deck.map(e => ({ id: e.carta.id, nombre: e.carta.nombre, qty: e.qty }))
      };
      // Blob = "archivo en memoria" = convertir el objeto JS en texto JSON y se empaqueta como archivo descargable
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');                  // crear un enlace invisible
      a.href = URL.createObjectURL(blob);                     // URl que apunta al blob
      a.download = nombre.replace(/\s+/g, '-') + '.json';     // nombre del archivo al descargar
      a.click();                                              // simular clic en el botón
      URL.revokeObjectURL(a.href);                            // liberar la URL
    }

    // -------------------------------------------------------------- IMPORTAR MAZO DESDE JSON
    function importDeck(event) {
      const file = event.target.files[0]; if (!file) return;  // el archivo que el usuario seleccionó en el <input type="file">
      const reader = new FileReader();                        // API del navegador para leer archivos locales

      reader.onload = e => {                                  // se ejecuta cuando termina de leer el archivo
        try {
          const data = JSON.parse(e.target.result);           // convertir el texto del archivo en objeto JS
          if (!data.entries) throw '';                        // error si fallo de formato
          deck = [];
          data.entries.forEach(entry => { const c = CATALOGUE.find(x => x.id === entry.id); if (c) deck.push({carta:c,qty:entry.qty}); });
          currentDeckId = null;
          document.getElementById('deckNameInput').value = data.nombre || t("deckbuilder.nombreMazoImportado");
          document.querySelectorAll('.card-count-badge').forEach(b => b.remove());
          document.querySelectorAll('.card-thumb.in-deck').forEach(el => el.classList.remove('in-deck'));
          deck.forEach(e => refreshThumbBadge(e.carta.id));
          renderDeckList();
        } catch {}                                            // si algún error, no se hace nada
      };
      reader.readAsText(file);                                // dispara la lectura del archivo como texto (esto activa el onload de arriba)
      event.target.value = '';
    }

    // =======================================================================================
    // ==================================================================== MAZOS PREDEFINIDOS
    let PREDEFINED_DECKS = [];   // se rellena al cargar los archivos de mazos/

    async function cargarMazosPredefinidos() {
      const resultados = await Promise.all(MAZOS_PREDEFINIDOS.map(async m => {
        try {
          const r = await fetch("mazos/" + m.archivo);                      // pedir el archivo
          if (!r.ok) throw new Error("HTTP " + r.status);
          const data = await r.json();                                      // convertirlo en objeto
          if (!Array.isArray(data.entries)) throw new Error("el archivo no tiene 'entries'");
          return {
            ...m,                                                           // autor, descripción, miniatura…
            nombre: m.nombre || data.nombre || m.archivo,
            entries: data.entries.map(e => ({ id: e.id, qty: e.qty }))      // solo id y cantidad
          };
        } catch (err) {
          console.warn("[mazos] no se pudo cargar", m.archivo, err);        // un mazo roto no impide cargar los demás
          return null;
        }
      }));
      PREDEFINED_DECKS = resultados.filter(Boolean);                        // quitar los que fallaron
    }

    // escuela principal de un mazo: la que tiene más copias entre sus personajes
    function escuelaPrincipal(entries) {
      const cuenta = {};
      entries.forEach(e => {
        const c = CATALOGUE.find(x => x.id === e.id);
        if (c && c.tipo === "personaje" && c.escuela) {
          cuenta[c.escuela] = (cuenta[c.escuela] || 0) + e.qty;   // sumar sus copias
        }
      });
      // la escuela con el número más alto (o "" si no hay personajes)
      return Object.keys(cuenta).sort((a, b) => cuenta[b] - cuenta[a])[0] || "";
    }

    // descripción en el idioma activo: admite texto simple o { es, en, fr }
    function descripcionMazo(d) {
      if (typeof d.descripcion === "object" && d.descripcion) {
        return d.descripcion[idiomaActivo] || d.descripcion.es || "";
      }
      return d.descripcion || "";
    }

    function renderPredefined() {
      document.getElementById("predefinedGrid").innerHTML = PREDEFINED_DECKS.map((d, i) => {
        const escuela   = escuelaPrincipal(d.entries);
        // color del mazo: el que indiques en lista.js (un #color o el nombre de una escuela); si no, el de su escuela principal
        const color = d.color
          ? (d.color.startsWith("#") ? d.color : getSchoolColor(d.color))
          : getSchoolColor(escuela);
        const portada   = d.miniatura || d.entries[0]?.id;   // si no eligió portada, la primera carta
        const enfoque   = d.enfoque || "center 22%";         // por defecto, la zona de la cara

        return `
        <div class="pre-deck-card" style="--color-escuela:${color}; --tinta-escuela:${tintaSobre(color)}">
          <div class="pre-deck-banner" style="background-image:url('${imgPath(portada)}'); background-position:${enfoque}"></div>
          <div class="pre-deck-body">
            <div class="pre-deck-name">${d.nombre}</div>
            ${d.autor ? `<div class="pre-deck-autor">${t("deckbuilder.porAutor", { autor: d.autor })}</div>` : ""}
            <div class="pre-deck-desc">${descripcionMazo(d)}</div>
            <button class="pre-deck-load btn-menu" onclick="loadPredefined(${i})">${t("deckbuilder.cargarPredefinido")}</button>
          </div>
        </div>`;
      }).join("");
    }

    function loadPredefined(idx) {
      const pd = PREDEFINED_DECKS[idx];
      deck = [];
      pd.entries.forEach(e => { const c = CATALOGUE.find(x => x.id === e.id); if (c) deck.push({carta:c,qty:e.qty}); });
      currentDeckId = null;
      document.getElementById('deckNameInput').value = pd.nombre;
      document.querySelectorAll('.card-count-badge').forEach(b => b.remove());
      document.querySelectorAll('.card-thumb.in-deck').forEach(el => el.classList.remove('in-deck'));
      deck.forEach(e => refreshThumbBadge(e.carta.id));
      renderDeckList();
      setTab('builder');   // ← vuelve a la vista constructor para ver el mazo cargado
    }

    // ------------------------------------- ETIQUETA CON EL NOMBRE AL PASAR POR LA LÍNEA DE INFORMACIÓN
    const etiquetaNombre = document.getElementById("etiquetaNombre");
    const gridCatalogo   = document.getElementById("catalogueGrid");

    gridCatalogo.addEventListener("mousemove", function (e) {
      const tarjeta = e.target.closest(".card-thumb");       // ¿el ratón está sobre alguna carta?
      if (!tarjeta) {                                        // no (está en un hueco entre cartas): ocultar
        etiquetaNombre.style.display = "none";
        return;
      }

      // nombre y colores de esta carta (los guardamos en la tarjeta al crearla)
      etiquetaNombre.textContent      = tarjeta.querySelector(".card-info").dataset.nombre;
      etiquetaNombre.style.background = tarjeta.style.getPropertyValue("--color-escuela");
      etiquetaNombre.style.color      = tarjeta.style.getPropertyValue("--tinta-escuela");
      etiquetaNombre.style.display    = "block";

      // abajo a la derecha del ratón
      let x = e.clientX + 12;
      let y = e.clientY + 16;
      // si se sale por la derecha de la ventana, se coloca a la izquierda del ratón
      if (x + etiquetaNombre.offsetWidth > window.innerWidth - 8) {
        x = e.clientX - etiquetaNombre.offsetWidth - 12;
      }
      etiquetaNombre.style.left = x + "px";
      etiquetaNombre.style.top  = y + "px";
    });

    // al salir del catálogo, ocultar
    gridCatalogo.addEventListener("mouseleave", function () {
      etiquetaNombre.style.display = "none";
    });
  
    // -------------------------------------------------------------- ARRANCAR PANEL DEL MAZO AL INICIAR
    cargarMazosPredefinidos();   // cargar los mazos de la carpeta mazos/
    renderSavedDecks();
    renderDeckList();
    document.getElementById('deckNameInput').value = t("deckbuilder.nombreMazoDefecto");   // nombre inicial, en el idioma activo

    llenarListaEscuela();
    renderExpansionPills();
    renderFasePills();
    applyFilters();  
  </script>

  <script>
    // ====================================================== ESCALAR LA ZONA DE ARRIBA (cabecera y filtros)
    const ANCHO_DISENO_CENTRO = 1100;   // ancho de columna central para el que está diseñada la zona de arriba

    function escalarCabecera() {
      const centro = document.querySelector(".columna-central");
      const escala = centro.clientWidth / ANCHO_DISENO_CENTRO;     // cuántas veces cabe el diseño

      // cabecera, filtros, aviso P03 y contador de cartas
      document.querySelectorAll("header, .filters, .aviso-p03, .card-count").forEach(function (el) {
        el.style.zoom = escala;
      });
    }

    // al cargar y cada vez que cambie el ancho de la columna central
    new ResizeObserver(escalarCabecera).observe(document.querySelector(".columna-central"));

    // ====================================================== ESCALAR LA COLUMNA DERECHA (el mazo)
    const ANCHO_DISENO_DERECHA = 340;   // ancho de columna para el que está diseñado su contenido

    function escalarColumnaDerecha() {
      const columna = document.querySelector(".columna-derecha");
      const escala = columna.clientWidth / ANCHO_DISENO_DERECHA;

      // cada bloque de la columna: cabecera del mazo, botones, lista y decks guardados
      columna.querySelectorAll(":scope > *").forEach(function (el) {
        el.style.zoom = escala;
      });
    }

    // ====================================================== ESCALAR EL PREVIEW (columna izquierda)
    const ANCHO_DISENO_IZQUIERDA = 380;   // ancho de columna para el que está diseñado el preview

    function escalarColumnaIzquierda() {
      const columna = document.getElementById("columna-izquierda");
      const escala  = columna.clientWidth / ANCHO_DISENO_IZQUIERDA;
      document.getElementById("previewPanel").style.zoom = escala;
    }

    new ResizeObserver(escalarColumnaIzquierda).observe(document.getElementById("columna-izquierda"));
    new ResizeObserver(escalarColumnaDerecha).observe(document.querySelector(".columna-derecha"));
  </script>
