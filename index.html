<!DOCTYPE html>  <!-- documento HTML5 -->
<html lang="es">
<head>
  <link rel="icon" type="image/png" href="favicon.png">                   <!-- icono navegador -->
  <meta charset="UTF-8">                                                  <!-- codificación de caracteres -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <!-- responsive básico -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="base.css">

  <title>HV-TCG</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }                  /* reset básico para todos los elementos */

    :root {                                           /* variables de color reutilizables en toda la página */
      --surface: #16161a;                           /* superficie de paneles */
      --surface2: #1e1e24;                          /* superficie secundaria (inputs, etc) */
      --border: rgba(255,255,255,0.07);             /* borde sutil */
      --border2: rgba(255,255,255,0.13);            /* borde un poco más marcado */
      --text: #e8e8ec;                              /* texto principal */
      --text2: #5c5c6a;                             /* texto secundario, ahora legible sobre #eee */
      --accent: #E8761A;                            /* color naranja secundario */
      --font-display: 'Anton', sans-serif;       /* fuente para títulos */
      --font-body: 'Noto Sans JP', sans-serif;        /* fuente para texto normal */
    }
    body {
      background: var(--bg);           /* fondo oscuro de toda la página */
      color: var(--tinta);             /* texto por defecto oscuro, porque el fondo es claro */
      font-family: var(--font-body);
      min-height: 100vh;               /* ocupa toda la altura de la pantalla */
      display: flex;                   /* flexbox para centrar contenido */
      flex-direction: column;          /* apilado en columna */
      align-items: center;             /* centrado horizontal */
      justify-content: center;         /* centrado vertical */
    }
    .pantalla {
      display: none;              /* oculta por defecto — se muestra con JS al activarla */
      flex-direction: column;     /* contenido interno en columna */
      align-items: center;        /* centrado horizontal del contenido */
      gap: 20px;                  /* separación entre elementos internos */
      width: 100%;                /* ancho completo disponible */
      max-width: 400px;           /* pero limitado para que no se estire demasiado */
      padding: 20px;              /* aire interior */
      margin: auto 0;              /* centrada vertical en el espacio libre */
    }
    .pantalla.activa {
      display: flex;              /* la pantalla con esta clase es la que se muestra */
    }
    h1 {                          /* cabecera 1 */
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 78px;                            /* más grande, para compensar lo estrecha que es Bebas */
      letter-spacing: 4px;
      text-align: center;            /* por si el título llega a partirse en dos líneas */
      padding-left: 4px;             /* compensa el espacio extra que deja letter-spacing tras la última letra */
      color: var(--tinta);                        /* relleno negro */
      -webkit-text-stroke: 4px var(--accent);     /* borde de las letras en el color de acento */
      paint-order: stroke fill;                   /* el borde se pinta detrás del relleno */
    }

    /* ------------------------------- BOTONES ------------------------------------- */
    .btn-menu {
      display: block;                    /* ocupa toda la línea, igual que un botón */
      width: 80%;                       /* ancho completo del contenedor */
      padding: 10px;                     /* aire interior */
      text-decoration: none;             /* quitar subrayado de los <a> */
      text-align: center;                /* texto centrado */
      font-size: 14px;                   /* tamaño de letra */
      margin-left: auto;                 /* el espacio sobrante se reparte a los dos lados */
      margin-right: auto;
    }

    /* ------------------------------- SETTINGS ------------------------------------- */
    .input-settings {
      width: 100%;                       /* ancho completo */
      padding: 10px;                     /* aire interior */
      background: var(--surface2);       /* fondo oscuro */
      border: 2px solid var(--accent);  /* borde sutil */
      border-radius: 0px;                /* esquinas redondeadas */
      color: var(--text);                /* texto claro */
      font-size: 15px;                   /* tamaño legible */
      font-family: inherit;              /* heredar fuente */
      outline: none;                     /* quitar el borde azul de foco */
    }

    /* ------------------------ SETTINGS: DOS COLUMNAS ----------------------- */
    #pantalla-settings {
      max-width: 560px;                  /* más ancha que las demás: caben dos columnas */
    }
    .btn-opcion     { padding: 5px 9px; font-size: 11px; }
    .ajustes-columnas {
      display: grid;
      grid-template-columns: 1fr 1fr;    /* dos columnas iguales */
      gap: 24px;
      width: 100%;
      align-items: start;                /* cada columna empieza arriba, aunque midan distinto */
    }
    .ajustes-columna {
      display: flex;
      flex-direction: column;
      gap: 14px;                         /* espacio entre opciones */
      min-width: 0;                      /* deja que la columna se estreche si hace falta */
    }
    .opcion {
      display: flex;
      flex-direction: column;
      gap: 5px;                          /* espacio entre etiqueta y control */
    }
    .opcion label {
      font-size: 11px;
      color: var(--text2);
    }
    .fila-opciones {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;                   /* los colores saltan de línea si no caben */
    }
    .fila-opciones select {
      flex: 1;                           /* el desplegable ocupa el hueco que deja el ▶ */
      min-width: 0;
    }

    /* controles más pequeños, solo en ajustes */
    #pantalla-settings .input-settings { padding: 6px; font-size: 12px; }
    #pantalla-settings .btn-idioma     { padding: 5px 9px; font-size: 11px; }
    #pantalla-settings .swatch-color   { width: 24px; height: 24px; }

    /* ------------------------ FILA DE BOTONES ----------------------- */
    .fila-botones {
      display: flex;
      gap: 12px;
      width: 100%;
    }
    .fila-botones .btn-menu {
      flex: 1;                           /* los dos botones, del mismo ancho */
    }

    /* ------------------------------------------ TRIPTICO ----------------------------- */
    /* ------------------------ CONTENEDOR  ----------------------- */
    .triptico {
      display: flex;                  /* las 3 columnas en fila */
      width: 100%;                    /* ocupa todo el ancho */
      height: 100vh;                  /* ocupa toda la altura de la pantalla */
      position: fixed;                /* fijo detrás de todo el contenido */
      top: 0;
      left: 0;
      justify-content: space-between; /* columnas laterales a los extremos, centro en medio */
    }

    /* ------------------------ COLUMNAS  ----------------------- */
    .columna-lateral {
      flex: 1;                          /* cada columna lateral ocupa espacio proporcional */
      background-size: cover;           /* la imagen cubre toda la columna sin deformarse */
      background-position: center;      /* centrada */
      background-repeat: no-repeat;
      min-width: 0;                     /* evita que flexbox las empuje a tamaño mínimo raro */
    }
    #columna-izquierda {
      background-image: url('img/fondos/index_columna_izquierda.jpg');
      background-color: #1a1a2e;
      border-right: 3px solid var(--accent);
    }
    #columna-derecha {
      background-image: url('img/fondos/index_columna_derecha.jpg'); 
      background-color: #2e0a0a;
      border-left: 3px solid var(--accent); 
    }
    .columna-central {
      width: 50%;                  /* siempre el 30% de la pantalla: las laterales, un 35% cada una */
      flex-shrink: 0;              /* nunca se encoge, aunque las laterales sí */
      background: var(--bg);       /* fondo negro/oscuro ya definido en :root */
      display: flex;
      flex-direction: column;      /* pantalla arriba, créditos abajo */
      align-items: center;
      overflow: hidden;            /* sin scroll: el escalado se encarga de que todo quepa */
    }

    /* ------------------------ CRÉDITOS ----------------------- */
    .creditos {
      flex-shrink: 0;              /* que no se aplaste */
      padding: 16px;
      font-size: 11px;
      color: var(--text2);
      line-height: 1.5;
      align-self: flex-end;          /* se pega al lado derecho de la columna central */
      text-align: right;             /* las líneas se alinean a la derecha entre sí */
    }

    /* ------------------------ RESPONSIVE ----------------------- */
    @media (max-width: 768px) {
      .columna-lateral {
        display: none;              /* ocultar columnas laterales */
      }
      .columna-central {
        width: 100%;                /* el panel central ocupa toda la pantalla */
      }
    }

    /* ------------------------ AJUSTES : COLORES ----------------------- */
    .swatch-color {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid var(--border2);
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }

    .swatch-color:hover {
      transform: scale(1.1);
    }

    .swatch-color.activo {
      border-color: white;
      box-shadow: 0 0 0 2px var(--accent);
    }

    .enlace-discord { color: var(--accent); font-weight: bold; }

    /* ------------------------ ESPACIADOS EXTRA ----------------------- */
    #pantalla-principal > div {
      margin-top: 40px;                  /* título del juego → botones (20 de gap + 20 = 40px) */
    }
    .ajustes-columnas {
      margin-top: 60px;                  /* «Settings» → opciones */
    }
    .fila-botones {
      margin-top: 80px;                  /* opciones → Guardar / Volver */
    }

    #pantalla-settings h1 {
      font-size: 36px;          /* el mismo que el título del deckbuilder */
    }
  </style>
</head>

<body>
  <!---------------------------------------- FONDO TRÍPTICO --------------------------------->
  <div class="triptico">
    <div class="columna-lateral" id="columna-izquierda"></div>
    <div class="columna-central">
      <!-- ============================================================ PANTALLA 1: BIENVENIDA -->
      <div class="pantalla" id="pantalla-bienvenida">
        <h1 class="titulo-marca">H!! VB SIM</h1>
        <p style="color: var(--text2); font-size: 14px; margin-top: -12px;">Haikyu!! Vobaca Break TCG Simulator</p>
        <div style="width:100%; display:flex; flex-direction:column; gap:6px;">
          <label style="font-size:13px; color:var(--text2);" data-i18n="menu.labelNombre">Tu nombre</label>
          <input type="text" id="input-nombre-bienvenida" maxlength="20" class="input-settings" placeholder="Ej: Andrés" data-i18n-placeholder="menu.placeholderNombre">
        </div>
        <div style="width:100%; display:flex; flex-direction:column; gap:6px;">
          <label style="font-size:13px; color:var(--text2);" data-i18n="menu.labelIdioma">Idioma</label>
          <div id="selector-idioma-bienvenida" style="display:flex; gap:6px;">
            <button type="button" data-idioma="es" onclick="cambiarIdiomaBienvenida('es')" class="btn-opcion">ES</button>
            <button type="button" data-idioma="en" onclick="cambiarIdiomaBienvenida('en')" class="btn-opcion">EN</button>
            <button type="button" data-idioma="fr" onclick="cambiarIdiomaBienvenida('fr')" class="btn-opcion">FR</button>
          </div>
        </div>
        <button onclick="confirmarBienvenida()" class="btn-menu" data-i18n="menu.btnContinuar">Continuar</button>
      </div>
      <!-- ============================================================ PANTALLA 2: PRINCIPAL -->
      <div class="pantalla" id="pantalla-principal">
        <h1 class="titulo-marca">H!! VB SIM</h1>
        <p style="color: var(--text2); font-size: 14px; margin-top: -12px;">Haikyu!! Vobaca Break TCG Simulator</p>
        <div style="display:flex; flex-direction:column; gap:12px; width:100%;">
          <a href="lobby.html" class="btn-menu" data-i18n="menu.btnJugar">PLAY</a>
          <a href="deckbuilding.html" class="btn-menu" data-i18n="menu.btnDeckbuilder">DECKBUILDER</a>
          <button onclick="abrirSettings()" class="btn-menu" data-i18n="menu.btnSettings">SETTINGS</button>
        </div>
      </div>
      <!-- ============================================================ PANTALLA 3: SETTINGS -->
      <!-- ============================================================ PANTALLA 3: SETTINGS -->
      <div class="pantalla" id="pantalla-settings">
        <h1 class="titulo-caja" data-i18n="menu.tituloSettings">Settings</h1>

        <div class="ajustes-columnas">
          <!-- ---------------------------------- COLUMNA IZQUIERDA: TÚ -->
          <div class="ajustes-columna">
            <div class="opcion">
              <label data-i18n="menu.labelNombreSettings">Nombre</label>
              <input type="text" id="input-nombre-settings" maxlength="20" class="input-settings">
            </div>
            <div class="opcion">
              <label data-i18n="menu.labelIdioma">Idioma</label>
              <div id="selector-idioma-settings" class="fila-opciones">
                <button type="button" data-idioma="es" onclick="cambiarIdiomaSettings('es')" class="btn-opcion">ES</button>
                <button type="button" data-idioma="en" onclick="cambiarIdiomaSettings('en')" class="btn-opcion">EN</button>
                <button type="button" data-idioma="fr" onclick="cambiarIdiomaSettings('fr')" class="btn-opcion">FR</button>
              </div>
            </div>
            <div class="opcion">
              <label data-i18n="menu.colorSecundario">Color secundario</label>
              <div id="paleta-colores" class="fila-opciones">
                <button type="button" class="swatch-color" data-color="#E8761A" style="background:#E8761A;" title="Karasuno" onclick="elegirColorPreset('#E8761A')"></button>
                <button type="button" class="swatch-color" data-color="#C62828" style="background:#C62828;" title="Nekoma" onclick="elegirColorPreset('#C62828')"></button>
                <button type="button" class="swatch-color" data-color="#D4AF37" style="background:#D4AF37;" title="Fukurodani" onclick="elegirColorPreset('#D4AF37')"></button>
                <button type="button" class="swatch-color" data-color="#a72bf3" style="background:#a72bf3;" title="Shiratorizawa" onclick="elegirColorPreset('#a72bf3')"></button>
                <button type="button" class="swatch-color" data-color="#4a9ee6" style="background:#4a9ee6;" title="Kamomedai" onclick="elegirColorPreset('#4a9ee6')"></button>
                <button type="button" class="swatch-color" data-color="#1AA6A0" style="background:#1AA6A0;" title="Aoba Jôsai" onclick="elegirColorPreset('#1AA6A0')"></button>
              </div>
            </div>
          </div>

          <!-- ---------------------------------- COLUMNA DERECHA: SONIDO -->
          <div class="ajustes-columna">
            <div class="opcion">
              <label data-i18n="menu.labelHinchada">Hinchada</label>
              <div class="fila-opciones">
                <select id="select-hinchada" class="input-settings"></select>
                <button type="button" class="btn-opcion" onclick="probarHinchada()">▶</button>
              </div>
            </div>
            <div class="opcion">
              <label data-i18n="menu.labelVolumen">Volumen</label>
              <input type="range" id="input-volumen" min="0" max="100" step="5" style="width:100%; accent-color:var(--accent);">
            </div>
          </div>
        </div>

        <!-- ---------------------------------- BOTONES: en la misma fila -->
        <div class="fila-botones">
          <button onclick="guardarSettings(); mostrarPantalla('principal')" class="btn-menu" data-i18n="menu.btnGuardar">Guardar</button>
          <button onclick="mostrarPantalla('principal')" class="btn-menu" data-i18n="menu.btnVolver">← Volver</button>
        </div>
      </div>
      <div class="creditos">
        A fan project by Skorkon Usui<br>
        Join us on <a href="https://discord.gg/a65qB22xA" target="_blank" rel="noopener" class="enlace-discord">Discord</a><br>
        Haikyuu!! © Haruichi Furudate / Shueisha<br>
        Vobaca!! BREAK TCG © Takara Tomy
      </div>
    </div> <!-- fin columna-central -->
    <div class="columna-lateral" id="columna-derecha"></div>
  </div> <!-- fin triptico -->

  <script src="i18n.js"></script>
  <script src="sonidos.js"></script>
  <script>
    // =============================================================== APLICAR COLOR GUARDADO AL CARGAR PÁGINA
    const colorGuardado = localStorage.getItem("hv-accent");
    if (colorGuardado) {
      document.documentElement.style.setProperty("--accent", colorGuardado);
    }
    // ====================================================================================== MOSTRAR PANTALLA
    function mostrarPantalla(nombre) {
      // quita la clase "activa" de todas las pantallas (las oculta todas)
      document.querySelectorAll(".pantalla").forEach(p => p.classList.remove("activa"));
      // añade la clase "activa" solo a la pantalla pedida (la muestra)
      document.getElementById("pantalla-" + nombre).classList.add("activa");
    }

    let idiomaTemporal = localStorage.getItem("hv-idioma") || "es";   // idioma actual, o español por defecto
    // =============================================================================================== AJUSTES
    // =================================================================================== COMPLETAR AL ENTRAR
    function abrirSettings() {
      document.getElementById("input-nombre-settings").value = localStorage.getItem("hv-nombre") || ""; // rellenar nombre actual
      idiomaTemporal = localStorage.getItem("hv-idioma") || "es";           // recuperar idioma actual
      colorTemporal = localStorage.getItem("hv-accent") || "#E8761A";       // recuperar color actual
      marcarIdiomaSettings();                                               // pintar el botón activo
      marcarColorActivo();
      cargarSonidoSettings();
      mostrarPantalla("settings");                                          // mostrar la pantalla
    }
    // ======================================================================================== CAMBIAR IDIOMA
    function cambiarIdiomaSettings(idioma) {
      idiomaTemporal = idioma; // guardar en variable temporal
      marcarIdiomaSettings(); // actualizar botón resaltado
    }
    // =================================================================================== MARCAR IDIOMA ACTIVO
    function marcarIdiomaSettings() {
      document.querySelectorAll("#selector-idioma-settings button").forEach(function(boton) {
        boton.classList.toggle("activo", boton.dataset.idioma === idiomaTemporal); // activa solo el botón que coincide
      });
    }
    // =================================================================================== SELECTOR DE COLORES
    // variable de color
    let colorTemporal = localStorage.getItem("hv-accent") || "#E8761A";

    // Elegir el color de la paleta
    function elegirColorPreset(color) {
      colorTemporal = color;
      marcarColorActivo();
    }

    // Marcar color activo
    function marcarColorActivo() {
      document.querySelectorAll(".swatch-color").forEach(function(swatch) {
        swatch.classList.toggle("activo", swatch.dataset.color === colorTemporal);
      });
    }
    // ========================================================================================= GUARDAR CAMBIOS
    function guardarSettings() {
      const nuevoNombre = document.getElementById("input-nombre-settings").value.trim() || "Jugador"; // nombre o valor por defecto
      localStorage.setItem("hv-nombre", nuevoNombre);     // guardar nombre
      localStorage.setItem("hv-idioma", idiomaTemporal);  // guardar idioma elegido
      localStorage.setItem("hv-accent", colorTemporal);   // guardar color elegido

      idiomaActivo = idiomaTemporal;    // actualizar la variable que usa t()
      aplicarIdioma();                  // refrescar los textos ya traducidos en pantalla
      document.documentElement.style.setProperty("--accent", colorTemporal); 

      localStorage.setItem("hv-hinchada", document.getElementById("select-hinchada").value);  
      localStorage.setItem("hv-volumen", document.getElementById("input-volumen").value / 100); 
      cargarSonidoSettings();          // repinta "Sin sonido" en el idioma recién guardado
    }

    // ======================================================================================== BIENVENIDA
    let idiomaBienvenida = "es";    // idioma por defecto en el primer registro
    // ===================================================================================== CAMBIAR IDIOMA
    function cambiarIdiomaBienvenida(idioma) {
      idiomaBienvenida = idioma; // guardar en variable temporal
      document.querySelectorAll("#selector-idioma-bienvenida button").forEach(function(boton) {
        boton.classList.toggle("activo", boton.dataset.idioma === idiomaBienvenida); // marcar botón activo
      });
    }

    // ===================================================================================== SETTINGS: SONIDO 
    // ======================================================================================================
    // rellena el desplegable con "Sin sonido" + las hinchadas de sonidos.js
    function llenarHinchadas() {
      const select = document.getElementById("select-hinchada");
      select.innerHTML = "";
      select.add(new Option(t("menu.sonidoNinguno"), "ninguna"));
      HINCHADAS.forEach(h => select.add(new Option(h.nombre, h.id)));
    }

    // rellena el desplegable y pone el valor guardado (o el de por defecto)
    function cargarSonidoSettings() {
      llenarHinchadas();
      const select = document.getElementById("select-hinchada");
      const guardada = obtenerHinchada();                   // viene de sonidos.js
      select.value = guardada;
      if (select.value !== guardada) select.value = HINCHADA_DEFECTO;   // si la guardada ya no existe en la lista
      document.getElementById("input-volumen").value = Math.round(obtenerVolumen() * 100);
    }

    // botón ▶: suena lo que hay elegido ahora, aunque aún no se haya guardado
    function probarHinchada() {
      const id = document.getElementById("select-hinchada").value;
      if (id === "ninguna") return;                         // "Sin sonido" no suena
      const audio = new Audio(`audio/${id}.mp3`);
      audio.volume = document.getElementById("input-volumen").value / 100;
      audio.play().catch(() => {});
    }

    // ================================================================================ CONFIRMAR Y GUARDAR
    function confirmarBienvenida() {
      const nombre = document.getElementById("input-nombre-bienvenida").value.trim() || "Jugador"; // nombre o valor por defecto
      localStorage.setItem("hv-nombre", nombre);            // guardar nombre
      localStorage.setItem("hv-idioma", idiomaBienvenida);  // guardar idioma elegido

      idiomaActivo = idiomaBienvenida;    // actualizar la variable que usa t()
      aplicarIdioma();                    // refrescar los textos ya traducidos en pantalla

      mostrarPantalla("principal");                         // ir a la pantalla principal
    }

    cambiarIdiomaBienvenida("en");      // idioma activo por defecto al cargar

    // ======================================================================================== DECISIÓN INICIAL
    const nombreGuardado = localStorage.getItem("hv-nombre"); // comprobar si ya hay un nombre guardado de antes
    if (!nombreGuardado) {            // si no hay nombre guardado
      mostrarPantalla("bienvenida");  // es la primera vez: mostrar pantalla de bienvenida
    } else {                          // si ya hay nombre guardado
      mostrarPantalla("principal");   // el jugador ya está registrado: ir directo a la pantalla principal
    }
  </script>

  <script>
    // ====================================================== ESCALAR EL CONTENIDO DE LA COLUMNA CENTRAL
    const ANCHO_DISENO = 750;   // ancho para el que está diseñado el contenido
    const MARGEN = 0.97;        // un 3% de respiro, para que el redondeo nunca corte nada

    function escalarColumnaCentral() {
      const columna = document.querySelector(".columna-central");
      const hijos = columna.querySelectorAll(":scope > *");   // las tres pantallas y los créditos

      // 1. volver a tamaño de diseño para medir cuánto ocupa el contenido de verdad
      hijos.forEach(el => el.style.zoom = 1);
      let altoContenido = 0;
      hijos.forEach(el => altoContenido += el.offsetHeight);  // las pantallas ocultas miden 0

      // 2. la escala es la menor entre lo que cabe a lo ancho y lo que cabe a lo alto
      const escala = Math.min(
        columna.offsetWidth  / ANCHO_DISENO,
        columna.clientHeight / altoContenido
      ) * MARGEN;

      // 3. aplicarla
      hijos.forEach(el => el.style.zoom = escala);
    }

    // recalcular cuando cambie el tamaño de la columna o de cualquier pantalla
    // (al pasar de una pantalla a otra, la nueva aparece y su tamaño cambia)
    const observador = new ResizeObserver(escalarColumnaCentral);
    observador.observe(document.querySelector(".columna-central"));
    document.querySelectorAll(".pantalla").forEach(p => observador.observe(p));
  </script>
</body>
</html>
